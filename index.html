// ══════════════════════════ builders ══════════════════════════

function buildRoomFloor(m, halo) {
  const { w, d } = ROOM;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m.carpet);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  const wear = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m.wear);
  wear.rotation.x = -Math.PI / 2; wear.position.y = 0.002; wear.renderOrder = 1;
  scene.add(wear);

  const T = ROOM_THRESHOLD, strip = new THREE.Mesh(new THREE.PlaneGeometry(T.x1 - T.x0, T.z1 - T.z0), m.threshold);
  strip.rotation.x = -Math.PI / 2; strip.position.set((T.x0 + T.x1) / 2, 0.004, (T.z0 + T.z1) / 2); strip.renderOrder = 2;
  scene.add(strip);

  // Cool street light and stray neon reflections spilling through the doors onto the floor.
  halo.pool(0x3f7dff, 0.42, 0, 0.008, 5.9, 3.6, 3.0);
  halo.pool(NEON.pink, 0.24, -1.15, 0.008, 5.5, 1.5, 1.2);
  halo.pool(NEON.cyan, 0.22, 1.2, 0.008, 5.6, 1.5, 1.2);
}

function buildRoomWalls(m, paint, metal, neon, halo) {
  const { w, d, h } = ROOM, hw = w / 2, hd = d / 2, D = ROOM_DOOR, up = [0, 1, 0], down = [0, -1, 0];
  const wallGeos = [];
  roomWallQuad(wallGeos, [-hw, -hd], [hw, -hd], 0, h, 0, 0);                                      // north
  roomWallQuad(wallGeos, [hw, -hd], [hw, hd], 0, h, 0, 1.5);                                      // east
  roomWallQuad(wallGeos, [hw, hd], [D.halfW, hd], 0, h, 0, 2.5);                                  // south, east of the door
  roomWallQuad(wallGeos, [D.halfW, hd], [-D.halfW, hd], D.h, h, hw - D.halfW, 2.5);               // south, above the door
  roomWallQuad(wallGeos, [-D.halfW, hd], [-hw, hd], 0, h, hw + D.halfW, 2.5);                     // south, west of the door
  roomWallQuad(wallGeos, [-hw, hd], [-hw, -hd], 0, h, 0, 0.5);                                    // west
  roomFlush(wallGeos, m.wall);

  // Baseboard, chair rail and cornice run round every wall (the door gap is skipped on the south wall).
  const runs = [
    { axis: 'x', c: 0, len: w, wallPos: -hd, sign: 1 },                                       // north
    { axis: 'x', c: 0, len: w, wallPos: hd, sign: -1, gap: true },                            // south
    { axis: 'z', c: 0, len: d, wallPos: hw, sign: -1 },                                       // east
    { axis: 'z', c: 0, len: d, wallPos: -hw, sign: 1 },                                       // west
  ];
  const placeBox = (out, run, from, to, sy, sz, y) => {          // box along a wall between two coordinates, hugging the wall
    const len = to - from, mid = (from + to) / 2, off = run.sign * sz / 2;
    if (run.axis === 'x') roomBox(out, len, sy, sz, mid, y, run.wallPos + off); else roomBox(out, sz, sy, len, run.wallPos + off, y, mid);
  };
  for (const run of runs) {
    const spans = run.gap ? [[-hw, -D.halfW], [D.halfW, hw]] : [[-run.len / 2, run.len / 2]];
    for (const [a, b] of spans) {
      placeBox(paint, run, a, b, 0.14, 0.03, 0.07);              // baseboard
      placeBox(metal, run, a, b, 0.04, 0.045, 1.08);             // chair rail
    }
    placeBox(paint, run, -run.len / 2, run.len / 2, 0.15, 0.16, 3.905);       // cornice ledge (hides the cove tube from above)
  }

  // Corner posts with a vertical neon edge each.
  const corners = [[-hw, -hd, NEON.cyan], [hw, -hd, NEON.pink], [-hw, hd, NEON.pink], [hw, hd, NEON.cyan]];
  for (const [cx, cz, colour] of corners) {
    const sx = cx < 0 ? 1 : -1, sz = cz < 0 ? 1 : -1;
    roomBox(paint, 0.16, 3.83, 0.16, cx + sx * 0.08, 1.915, cz + sz * 0.08);
    neon.bar(colour, ROOM_NEON_LEVEL.corner, 0.03, 3.4, 0.03, cx + sx * 0.155, 1.9, cz + sz * 0.155);
    halo.strip(colour, 0.22, [cx + sx * 0.17, 0.2, cz + sz * 0.005], [cx + sx * 0.17, 3.75, cz + sz * 0.005], [sx, 0, 0], 0.7);
  }

  // Neon lines (cove, wall line, baseboard). Colours follow the v1 scheme: north pink, south cyan, sides purple.
  const cv = ROOM_TRIM_Y.cove, ln = ROOM_TRIM_Y.line, bs = ROOM_TRIM_Y.base, off = 0.045;
  const line = (colour, level, axis, wallPos, sign, from, to, y, thick = 0.03) => {
    const len = to - from, mid = (from + to) / 2, o = wallPos + sign * off;
    if (axis === 'x') neon.bar(colour, level, len, thick, thick, mid, y, o); else neon.bar(colour, level, thick, thick, len, o, y, mid);
  };
  // Cyan cove tube under the cornice, all round.
  line(NEON.cyan, ROOM_NEON_LEVEL.cove, 'x', -hd, 1, -hw + 0.2, hw - 0.2, cv);
  line(NEON.cyan, ROOM_NEON_LEVEL.cove, 'x', hd, -1, -hw + 0.2, hw - 0.2, cv);
  line(NEON.cyan, ROOM_NEON_LEVEL.cove, 'z', hw, -1, -hd + 0.2, hd - 0.2, cv);
  line(NEON.cyan, ROOM_NEON_LEVEL.cove, 'z', -hw, 1, -hd + 0.2, hd - 0.2, cv);
  // Wall lines at 3.2 m; the north one stops at the pilasters so the sign bay stays clear.
  const px = ROOM_PILASTER_X[1] + 0.35;
  line(NEON.pink, ROOM_NEON_LEVEL.line, 'x', -hd, 1, -hw + 0.4, -px, ln);
  line(NEON.pink, ROOM_NEON_LEVEL.line, 'x', -hd, 1, px, hw - 0.4, ln);
  line(NEON.cyan, ROOM_NEON_LEVEL.line, 'x', hd, -1, -hw + 0.4, -D.halfW - 0.5, ln);
  line(NEON.cyan, ROOM_NEON_LEVEL.line, 'x', hd, -1, D.halfW + 0.5, hw - 0.4, ln);
  line(NEON.purple, ROOM_NEON_LEVEL.line, 'z', hw, -1, -hd + 0.4, hd - 0.4, ln);
  line(NEON.purple, ROOM_NEON_LEVEL.line, 'z', -hw, 1, -hd + 0.4, hd - 0.4, ln);
  // Baseboard glow (usually half hidden behind cabinets, which then get a coloured rim).
  line(NEON.pink, ROOM_NEON_LEVEL.base, 'x', -hd, 1, -hw + 0.4, hw - 0.4, bs, 0.022);
  line(NEON.cyan, ROOM_NEON_LEVEL.base, 'x', hd, -1, -hw + 0.4, -D.halfW - 0.2, bs, 0.022);
  line(NEON.cyan, ROOM_NEON_LEVEL.base, 'x', hd, -1, D.halfW + 0.2, hw - 0.4, bs, 0.022);
  line(NEON.purple, ROOM_NEON_LEVEL.base, 'z', hw, -1, -hd + 0.4, hd - 0.4, bs, 0.022);
  line(NEON.purple, ROOM_NEON_LEVEL.base, 'z', -hw, 1, -hd + 0.4, hd - 0.4, bs, 0.022);

  // Light spill from those lines onto the wall (up and down), the ceiling (cove) and the floor (baseboard).
  const S = 0.008;
  const wallHalo = (colour, str, axis, wallPos, sign, from, to, y, reach) => {
    const a = axis === 'x' ? [from, y, wallPos + sign * S] : [wallPos + sign * S, y, from];
    const b = axis === 'x' ? [to, y, wallPos + sign * S] : [wallPos + sign * S, y, to];
    halo.strip(colour, str, a, b, up, reach); halo.strip(colour, str, a, b, down, reach);
  };
  const inward = (axis, sign) => (axis === 'x' ? [0, 0, sign] : [sign, 0, 0]);
  const horizontalHalo = (colour, str, axis, wallPos, sign, from, to, reach, y) => {     // glow lying on the ceiling or floor
    const a = axis === 'x' ? [from, y, wallPos] : [wallPos, y, from], b = axis === 'x' ? [to, y, wallPos] : [wallPos, y, to];
    halo.strip(colour, str, a, b, inward(axis, sign), reach);
  };
  for (const [axis, wallPos, sign, from, to] of [['x', -hd, 1, -hw, hw], ['x', hd, -1, -hw, hw], ['z', hw, -1, -hd, hd], ['z', -hw, 1, -hd, hd]]) {
    horizontalHalo(NEON.cyan, 0.30, axis, wallPos, sign, from, to, 1.5, h - 0.006);     // cove -> ceiling
    halo.strip(NEON.cyan, 0.16, axis === 'x' ? [from, cv, wallPos + sign * S] : [wallPos + sign * S, cv, from],
               axis === 'x' ? [to, cv, wallPos + sign * S] : [wallPos + sign * S, cv, to], down, 0.5);   // cove -> wall
    horizontalHalo(axis === 'x' ? (sign > 0 ? NEON.pink : NEON.cyan) : NEON.purple, 0.28, axis, wallPos, sign, from, to, 0.8, 0.008);   // base -> floor
  }
  wallHalo(NEON.pink, 0.30, 'x', -hd, 1, -hw + 0.4, -px, ln, 0.7);
  wallHalo(NEON.pink, 0.30, 'x', -hd, 1, px, hw - 0.4, ln, 0.7);
  wallHalo(NEON.cyan, 0.26, 'x', hd, -1, -hw + 0.4, -D.halfW - 0.5, ln, 0.7);
  wallHalo(NEON.cyan, 0.26, 'x', hd, -1, D.halfW + 0.5, hw - 0.4, ln, 0.7);
  wallHalo(NEON.purple, 0.32, 'z', hw, -1, -hd + 0.4, hd - 0.4, ln, 0.8);
  wallHalo(NEON.purple, 0.32, 'z', -hw, 1, -hd + 0.4, hd - 0.4, ln, 0.8);
}

// Wall-mounted extras: conduits with clamps, junction boxes, louvred vents, an electrical cabinet, pilasters.
function buildRoomWallDetails(m, paint, metal, neon, halo) {
  const { w, d } = ROOM, hw = w / 2, hd = d / 2;
  const conduit = (x, z, axisSign) => {                 // vertical conduit run with clamps and a junction box
    roomCyl(metal, 0.022, 3.55, 'y', x, 1.975, z, 8);
    for (const y of [0.5, 1.4, 2.3, 3.2]) roomBox(metal, 0.06, 0.03, 0.03, x, y, z + axisSign * 0.012);
    roomBox(metal, 0.2, 0.26, 0.09, x, 1.55, z + axisSign * 0.03);
    roomBox(paint, 0.17, 0.2, 0.01, x, 1.55, z + axisSign * 0.08);
  };
  conduit(-6.35, -hd + 0.03, 1); conduit(6.35, -hd + 0.03, 1);
  for (const sx of [-1, 1]) {                            // south end of the side walls
    roomCyl(metal, 0.022, 3.55, 'y', sx * (hw - 0.03), 1.975, 5.3, 8);
    roomBox(metal, 0.09, 0.26, 0.2, sx * (hw - 0.05), 1.55, 5.3);
  }
  // Louvred vents beside the door.
  for (const sx of [-1, 1]) {
    const x = sx * 2.1, z = hd - 0.02;
    roomBox(paint, 0.6, 0.36, 0.03, x, 0.4, z);
    for (let i = 0; i < 6; i++) roomBox(metal, 0.52, 0.018, 0.028, x, 0.28 + i * 0.05, z - 0.008);
  }
  // Electrical cabinet on the east wall, just south of the pinball row.
  roomBox(metal, 0.1, 0.7, 0.5, hw - 0.05, 1.65, 4.6);
  roomBox(paint, 0.02, 0.6, 0.42, hw - 0.11, 1.65, 4.6);
  roomBox(metal, 0.03, 0.08, 0.03, hw - 0.13, 1.65, 4.77);

  // Pilasters: 0.5 m x 0.35 m columns against the north wall with neon wraps (outside every reserved zone).
  for (const x of ROOM_PILASTER_X) {
    roomBox(paint, 0.5, 3.83, 0.35, x, 1.915, -hd + 0.175);
    addCollider(x - 0.25, x + 0.25, -hd, -hd + 0.35);
    roomBox(metal, 0.54, 0.12, 0.39, x, 0.06, -hd + 0.195);                  // plinth
    for (const y of [0.55, 3.3]) {                                           // neon wraps on the front and both sides
      const c = y > 2 ? NEON.pink : NEON.cyan;
      neon.bar(c, ROOM_NEON_LEVEL.accent, 0.5, 0.03, 0.03, x, y, -hd + 0.35 + 0.016);
      for (const sx of [-1, 1]) neon.bar(c, ROOM_NEON_LEVEL.accent, 0.03, 0.03, 0.35, x + sx * (0.25 + 0.016), y, -hd + 0.175);
      halo.strip(c, 0.2, [x - 0.25, y, -hd + 0.35 + 0.008], [x + 0.25, y, -hd + 0.35 + 0.008], [0, 1, 0], 0.45);
      halo.strip(c, 0.2, [x - 0.25, y, -hd + 0.35 + 0.008], [x + 0.25, y, -hd + 0.35 + 0.008], [0, -1, 0], 0.45);
    }
    for (const sx of [-1, 1]) neon.bar(NEON.purple, ROOM_NEON_LEVEL.accent, 0.03, 3.2, 0.03, x + sx * 0.26, 1.9, -hd + 0.35 + 0.016);
  }
}

// Steel truss (box section: 4 chords, zig-zag on the underside and both sides). axis: 'x' or 'z'.
function roomAddTruss(out, axis, cx, cy, cz, len) {
  const HW = ROOM_TRUSS.halfW, HH = ROOM_TRUSS.halfH;
  const P = axis === 'x' ? (s, u, v) => [cx + s, cy + v, cz + u] : (s, u, v) => [cx + u, cy + v, cz + s];   // s along, u across, v up
  for (const u of [-HW, HW]) for (const v of [-HH, HH]) roomStrut(out, ...P(-len / 2, u, v), ...P(len / 2, u, v), 0.045);
  const n = Math.round(len / 0.6), step = len / n;
  for (let i = 0; i < n; i++) {
    const s0 = -len / 2 + i * step, s1 = s0 + step, f = i % 2 ? 1 : -1;
    roomStrut(out, ...P(s0, -f * HW, -HH), ...P(s1, f * HW, -HH), 0.024);
    for (const u of [-HW, HW]) roomStrut(out, ...P(s0, u, -f * HH), ...P(s1, u, f * HH), 0.024);
  }
}

function buildRoomCeiling(m, paint) {
  const { w, d, h } = ROOM, hd = d / 2, TR = ROOM_TRUSS, DR = ROOM_DROP;

  // Exposed deck.
  const deck = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m.deck);
  deck.rotation.x = Math.PI / 2; deck.position.y = h;
  scene.add(deck);

  // Truss grid + mount plates for spot cans at every crossing.
  const steel = [];
  for (const z of TR.z) roomAddTruss(steel, 'x', 0, TR.y, z, w - 0.4);
  for (const x of TR.x) roomAddTruss(steel, 'z', x, TR.y, -1.3, 11);          // z from -6.8 to 4.2 (stops at the soffit)
  for (const p of ROOM_SPOT_MOUNTS) {
    roomBox(steel, 0.2, 0.025, 0.2, p.x, p.y - 0.0125, p.z);
    roomCyl(steel, 0.018, 0.09, 'y', p.x, p.y - 0.07, p.z, 8);
  }
  roomFlush(steel, m.steel);

  // Ducts: round spiral main, rectangular run, small round branch, with joint rings and hangers.
  const ducts = [], round = { r: 0.28, y: 3.33, z: -1.75, x0: -9.0, x1: 9.0 };
  roomCyl(ducts, round.r, round.x1 - round.x0, 'x', 0, round.y, round.z, 20);
  for (const sx of [-1, 1]) {
    const g = new THREE.SphereGeometry(round.r, 20, 12); g.translate(sx * round.x1, round.y, round.z); ducts.push(g);
    roomCyl(ducts, round.r, h - round.y, 'y', sx * round.x1, round.y + (h - round.y) / 2, round.z, 20);
  }
  for (let x = round.x0 + 1.2; x < round.x1; x += 1.8) roomCyl(ducts, round.r + 0.03, 0.07, 'x', x, round.y, round.z, 20);
  for (let x = -7.5; x <= 7.5; x += 5) for (const s of [-1, 1]) roomStrut(ducts, x, round.y + round.r, round.z + s * 0.2, x, h, round.z + s * 0.2, 0.02);
  const rect = { sx: 0.56, sy: 0.3, y: 3.46, z: 1.75, x0: -9.0, x1: 3.0 };
  roomBox(ducts, rect.x1 - rect.x0, rect.sy, rect.sx, (rect.x0 + rect.x1) / 2, rect.y, rect.z);
  for (let x = rect.x0 + 0.9; x < rect.x1; x += 1.5) roomBox(ducts, 0.05, rect.sy + 0.05, rect.sx + 0.05, x, rect.y, rect.z);
  roomBox(ducts, 0.5, 0.05, 0.5, -4.0, rect.y - rect.sy / 2 - 0.025, rect.z);             // supply diffuser plate
  roomBox(ducts, 0.4, 0.04, 0.4, -4.0, rect.y - rect.sy / 2 - 0.06, rect.z);
  for (let x = -7.5; x <= 2.5; x += 5) for (const s of [-1, 1]) roomStrut(ducts, x, rect.y + rect.sy / 2, rect.z + s * 0.25, x, h, rect.z + s * 0.25, 0.02);
  roomCyl(ducts, 0.13, 10.4, 'z', -5.0, 3.78, -1.4, 14);                                   // small branch, north-south
  for (let z = -6.2; z < 3.8; z += 1.6) roomCyl(ducts, 0.155, 0.06, 'z', -5.0, 3.78, z, 14);
  roomFlush(ducts, m.duct);

  // Sprinkler main (red) along the north side with heads, a copper line and a cable tray.
  const pipes = [], heads = [];
  roomCyl(pipes, 0.055, w - 0.6, 'x', 0, 3.88, -5.9, 12);
  for (let x = -8.5; x <= 8.5; x += 2.125) {
    roomCyl(pipes, 0.028, 0.2, 'y', x, 3.78, -5.9, 8);
    roomCyl(heads, 0.03, 0.06, 'y', x, 3.66, -5.9, 10);
    roomCyl(heads, 0.075, 0.012, 'y', x, 3.625, -5.9, 12);
  }
  for (let x = -9; x <= 9; x += 3) roomBox(pipes, 0.05, 0.14, 0.05, x, 3.93, -5.9);
  roomFlush(pipes, m.red); roomFlush(heads, m.brass);

  const tray = [], trayY = 3.9;
  const ladder = (axis, cx, cz, len) => {              // perforated ladder tray with two cables
    const across = 0.42;
    for (const s of [-1, 1]) {
      if (axis === 'x') { roomBox(tray, len, 0.07, 0.025, cx, trayY, cz + s * across / 2); }
      else { roomBox(tray, 0.025, 0.07, len, cx + s * across / 2, trayY, cz); }
    }
    for (let t = -len / 2 + 0.15; t < len / 2; t += 0.3) {
      if (axis === 'x') roomBox(tray, 0.02, 0.02, across, cx + t, trayY - 0.025, cz); else roomBox(tray, across, 0.02, 0.02, cx, trayY - 0.025, cz + t);
    }
    for (const s of [-0.1, 0.08]) {
      if (axis === 'x') roomCyl(tray, 0.022, len, 'x', cx, trayY - 0.005, cz + s, 8); else roomCyl(tray, 0.022, len, 'z', cx + s, trayY - 0.005, cz, 8);
    }
  };
  ladder('x', 0, -5.1, w - 0.8); ladder('z', 5.0, -0.6, 8.9);
  roomFlush(tray, m.steel);

  // Acoustic soffit above the entrance: T-bar tiles, fascia and a cyan/magenta edge (neon added by buildRoom).
  const soffit = new THREE.Mesh(new THREE.PlaneGeometry(w, hd - DR.z0), m.tiles);
  soffit.rotation.x = Math.PI / 2; soffit.position.set(0, DR.y, (DR.z0 + hd) / 2);
  scene.add(soffit);
  const fascia = [];
  roomBox(fascia, w, 0.16, 0.06, 0, DR.y - 0.08 + 0.0, DR.z0 + 0.03);
  roomBox(fascia, w, 0.04, 0.08, 0, DR.y - 0.18, DR.z0 + 0.04);
  roomFlush(fascia, m.paint);
}

function buildRoomEntrance(m, neon, halo) {
  const D = ROOM_DOOR, hd = ROOM.d / 2, zc = hd + 0.1;            // door plane sits 0.1 m into the 0.25 m wall thickness
  const alu = [];
  // Frame: jambs, head and threshold fill the wall thickness.
  for (const s of [-1, 1]) roomBox(alu, 0.1, D.h, 0.25, s * (D.halfW - 0.05), D.h / 2, hd + 0.125);
  roomBox(alu, D.halfW * 2, 0.1, 0.25, 0, D.h - 0.05, hd + 0.125);
  roomBox(alu, D.halfW * 2, 0.03, 0.25, 0, 0.015, hd + 0.125);
  // Two leaves: stiles, top rail, kick rail, push bars, door closers.
  const glassGeos = [];
  for (const s of [-1, 1]) {
    const inner = 0.012, outer = D.halfW - 0.1, cx = s * (inner + outer) / 2, wLeaf = outer - inner;
    for (const x of [s * (inner + 0.045), s * (outer - 0.045)]) roomBox(alu, 0.09, D.h - 0.13, 0.05, x, 0.03 + (D.h - 0.13) / 2 + 0.0, zc);
    roomBox(alu, wLeaf, 0.1, 0.05, cx, 2.35, zc);
    roomBox(alu, wLeaf, 0.28, 0.05, cx, 0.17, zc);
    roomCyl(alu, 0.018, wLeaf - 0.4, 'x', cx, 1.0, zc - 0.085, 12);
    for (const dx of [-1, 1]) roomCyl(alu, 0.011, 0.07, 'z', cx + dx * (wLeaf - 0.4) / 2, 1.0, zc - 0.05, 8);
    roomBox(alu, 0.4, 0.06, 0.06, cx, 2.29, zc - 0.055);
    const gw = wLeaf - 0.18, gh = 2.3 - 0.31, g = new THREE.PlaneGeometry(gw, gh);
    g.rotateY(Math.PI);                                   // face into the room (-z)
    g.translate(cx, 0.31 + gh / 2, zc);
    // Map each leaf to its own half of the glass texture.
    const uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setX(i, (s < 0 ? 0 : 0.5) + uv.getX(i) * 0.5);
    glassGeos.push(g);
  }
  roomFlush(alu, m.alu);
  roomFlush(glassGeos, m.glass, { renderOrder: 4 });

  // Night street beyond the doors: ground, backdrop and a few reflected neon pools.
  const gnd = new THREE.PlaneGeometry(12, 2.4, 1, 3);
  gnd.rotateX(-Math.PI / 2); gnd.translate(0, -0.02, hd + 0.25 + 1.2);
  const cols = new Float32Array(gnd.attributes.position.count * 3), near = new THREE.Color(0x05080f), far = new THREE.Color(0x0b1626), c = new THREE.Color();
  for (let i = 0; i < gnd.attributes.position.count; i++) {
    c.copy(near).lerp(far, (gnd.attributes.position.getZ(i) - (hd + 0.25)) / 2.4); c.toArray(cols, i * 3);
  }
  gnd.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  scene.add(new THREE.Mesh(gnd, m.ground));
  const back = new THREE.Mesh(new THREE.PlaneGeometry(12, 6), m.street);
  back.position.set(0, 2.3, hd + 0.25 + 2.4); back.rotation.y = Math.PI;
  scene.add(back);
  halo.pool(NEON.pink, 0.28, -1.6, -0.005, hd + 1.4, 1.1, 0.7);
  halo.pool(NEON.cyan, 0.26, 1.7, -0.005, hd + 1.7, 1.2, 0.8);
  halo.pool(0xffb347, 0.2, 0.2, -0.005, hd + 1.9, 1.4, 0.6);

  // Faint LED line in the door head and frame highlight so the entrance reads as its own lit bay.
  neon.bar(0x7fc8ff, 1.6, D.halfW * 2 - 0.3, 0.02, 0.02, 0, D.h - 0.115, zc - 0.05);
  registry.props.push({ kind: 'door', x: D.x, z: D.z });
}

// ══════════════════════════ entry point ══════════════════════════

function buildRoom() {
  const m = roomMaterials();
  const neon = roomNeonSet(), halo = roomHaloSet();
  const paint = [], metal = [];

  buildRoomFloor(m, halo);
  buildRoomWalls(m, paint, metal, neon, halo);
  buildRoomWallDetails(m, paint, metal, neon, halo);
  buildRoomCeiling(m, paint);
  buildRoomEntrance(m, neon, halo);

  // Fascia edge of the soffit: magenta tube plus its glow on the underside of the tiles.
  const D = ROOM_DROP;
  neon.bar(NEON.pink, ROOM_NEON_LEVEL.line, ROOM.w - 0.6, 0.03, 0.03, 0, D.y - 0.2, D.z0 + 0.04);
  halo.strip(NEON.pink, 0.2, [-ROOM.w / 2 + 0.3, D.y - 0.19, D.z0 + 0.06], [ROOM.w / 2 - 0.3, D.y - 0.19, D.z0 + 0.06], [0, 0, -1], 0.9);

  roomFlush(paint, m.paint);
  roomFlush(metal, m.metal);
  neon.flush();
  halo.flush();
}

// ═══════════════ VIDEO CABINETS: side-profile bodies, CRT + glass, marquee, controls, layout ═══════════════
// Owner: cabinets agent. Entry points: buildCabinets(), addCabinet(x, z, rotY, artIndex).
// Artwork (screen / marquee / side / panel textures) comes from makeCabinetArt(i) in 45-screens.js.
//
// Local cabinet space: front faces +z, floor at y = 0, 0.9 m wide (x), z from CAB_BACK to CAB_FRONT, ~2 m tall.
//
// How a cabinet is built (draw calls: 4 own meshes per cabinet + 12 instanced/merged batches for the whole arcade):
//  * The body is ONE ExtrudeGeometry of a 2D side profile (kick plate, coin-door body, overhanging control deck,
//    recessed monitor bay, angled marquee box, rounded roof). Its two side faces ("caps") wear the vinyl side art
//    (own mesh per cabinet); everything else (edge walls + bezel, coin door, joysticks, grille, scuffs...) is merged
//    into one vertex-coloured "shell" geometry per body style and drawn with InstancedMesh for all cabinets.
//  * Glowing bits (T-molding in the game colour, lit buttons, coin slots) and the glass layer are instanced too.
//  * Screen, marquee and control-panel decal are per-art meshes sharing geometry; art (and its materials) is shared
//    by cabinets that use the same game, so at most CAB_ART_LIMIT animated screens exist.
//  * Contact shadows and coloured light pools on the carpet are merged into two meshes for the whole arcade.



// ── Dimensions (metres) ──
const CAB_W = 0.9;                       // cabinet width
const CAB_BACK = -0.40;                  // local z of the back panel
const CAB_FRONT = 0.55;                  // furthest overhang (control deck lip); used for colliders
const CAB_BEVEL = 0.012;                 // rounded edge of the side panels
const CAB_BAY = { x0: 0.16, y0: 1.10, x1: 0.05, y1: 1.68 };   // slanted monitor bay: bottom and top (z, y)
const CAB_SCREEN = { w: 0.68, h: 0.51, hole: [0.64, 0.48], bulge: 0.014 };   // CRT picture (4:3) and bezel opening
const CAB_ART_LIMIT = 16;                // distinct games (= animated screens) at most
const CAB_BATCH_START = 32;              // initial instance capacity of each batch (grows on demand)
const CAB_BUTTONS = [0xff2a2a, 0xffd21a, 0x2ee65f, 0x2f7bff, 0xf4f4ff, 0xff8a1f];

// Three body styles: silhouette (deck, marquee box), colour scheme and control layout.
// deck: lip = front edge of the control deck, under = front of the lower (coin door) body.
// marquee: low/high = z of the lower / upper end of the slanted marquee face.
const CAB_STYLES = [
  { body: 0x1b1926, controls: 'twin',                                   // classic upright
    deck: { lipX: 0.55, lipY0: 0.88, lipY1: 0.99, underX: 0.36, underY: 0.82 },
    marquee: { lowX: 0.30, highX: 0.22, roofY: 2.02, radius: 0.035 } },
  { body: 0x131c36, controls: 'trackball',                              // bubble-top with trackball
    deck: { lipX: 0.53, lipY0: 0.84, lipY1: 1.00, underX: 0.35, underY: 0.78 },
    marquee: { lowX: 0.31, highX: 0.18, roofY: 2.06, radius: 0.10 } },
  { body: 0x2b1439, controls: 'fight',                                  // tall, steep deck, eight buttons
    deck: { lipX: 0.50, lipY0: 0.84, lipY1: 0.95, underX: 0.36, underY: 0.80 },
    marquee: { lowX: 0.28, highX: 0.25, roofY: 2.08, radius: 0.02 } },
];

// Control layouts for player 1 (u = across the deck, t = fraction of the deck depth, 0 = front). Mirrored for player 2.
const CAB_CONTROLS = {
  twin:      { stick: [-0.27, 0.5], buttons: [[-0.185, 0.66], [-0.135, 0.66], [-0.085, 0.66], [-0.16, 0.36], [-0.11, 0.36], [-0.06, 0.36]] },
  trackball: { stick: [-0.33, 0.5], buttons: [[-0.22, 0.62], [-0.17, 0.62], [-0.22, 0.34], [-0.17, 0.34]], trackball: [0, 0.55] },
  fight:     { stick: [-0.32, 0.5], buttons: [[-0.21, 0.66], [-0.16, 0.66], [-0.11, 0.66], [-0.06, 0.66], [-0.195, 0.36], [-0.145, 0.36], [-0.095, 0.36], [-0.045, 0.36]] },
};

// ── Small geometry helpers ──
const _cabWhite = new THREE.Color(1, 1, 1);

// Bakes one primitive into a non-indexed, uv-less geometry with a vertex colour (gain > 1 makes it glow) so that
// many different primitives can be merged into one geometry.
function cabPart(geometry, hex, matrix = null, gain = 1) {
  const g = geometry.index ? geometry.toNonIndexed() : geometry.clone();
  g.deleteAttribute('uv');
  if (matrix) g.applyMatrix4(matrix);
  const c = new THREE.Color(hex).multiplyScalar(gain), n = g.attributes.position.count, col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) col.set([c.r, c.g, c.b], i * 3);
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}

// A straight line of the side profile from p0 to p1 ([z, y] pairs) as a coordinate frame:
// at(u, t, h) = point u across the cabinet, t along the line, h out of the surface (towards the player).
function cabFrame(p0, p1) {
  const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
  const len = Math.hypot(dx, dy), ang = Math.atan2(dx, dy), s = Math.sin(ang), c = Math.cos(ang);
  return { len, ang, at: (u, t, h = 0) => new THREE.Vector3(u, p0[1] + c * t - s * h, p0[0] + s * t + c * h) };
}

// Matrix that puts a primitive (y = along the line, z = out of the surface) on a frame.
// tilt rotates it about x (PI/2 turns a cylinder's axis onto the surface normal); spin rotates it in the surface plane.
function cabPlace(frame, u, t, h = 0, tilt = 0, spin = 0) {
  const m = new THREE.Matrix4().makeTranslation(...frame.at(u, t, h).toArray());
  m.multiply(new THREE.Matrix4().makeRotationX(frame.ang + tilt));
  return spin ? m.multiply(new THREE.Matrix4().makeRotationZ(spin)) : m;
}

function cabTranslate(x, y, z) { return new THREE.Matrix4().makeTranslation(x, y, z); }

// Rounded-rectangle outline on a Path/Shape (also used for holes).
function cabTraceRoundRect(path, hw, hh, r) {
  path.moveTo(-hw + r, -hh);
  path.lineTo(hw - r, -hh);  path.absarc(hw - r, -hh + r, r, -Math.PI / 2, 0, false);
  path.lineTo(hw, hh - r);   path.absarc(hw - r, hh - r, r, 0, Math.PI / 2, false);
  path.lineTo(-hw + r, hh);  path.absarc(-hw + r, hh - r, r, Math.PI / 2, Math.PI, false);
  path.lineTo(-hw, -hh + r); path.absarc(-hw + r, -hh + r, r, Math.PI, Math.PI * 1.5, false);
}

// ── Side profile ──
// Control points [z, y, corner radius, T-molding?] going round the cabinet side, starting at the bottom back.
function cabProfile(s) {
  const d = s.deck, m = s.marquee, b = CAB_BAY;
  return [
    [CAB_BACK, 0, 0, 0],
    [0.30, 0, 0, 0],                       // kick plate (recessed)
    [0.30, 0.11, 0, 0],
    [d.underX, 0.11, 0, 1],                // lower body with the coin door
    [d.underX, d.underY, 0, 1],
    [d.lipX, d.lipY0, 0.012, 1],           // control deck overhang
    [d.lipX, d.lipY1, 0.014, 1],
    [b.x0, b.y0, 0.02, 1],                 // deck meets the monitor bay
    [b.x1, b.y1, 0.01, 1],                 // top of the slanted monitor bay
    [m.lowX, b.y1, 0.008, 1],              // underside of the marquee box
    [m.highX, m.roofY, m.radius, 1],       // marquee face rises to the roof
    [CAB_BACK, m.roofY, 0.05, 1],
  ];
}

// Rounds the corners of the control-point loop and returns a polyline [{x, y, wrap}] (x = z in cabinet space).
function cabOutline(points) {
  const out = [], n = points.length;
  for (let i = 0; i < n; i++) {
    const [x, y, r, wrap] = points[i];
    if (!r) { out.push({ x, y, wrap }); continue; }
    const [px, py] = points[(i + n - 1) % n], [nx, ny] = points[(i + 1) % n];
    const dp = Math.hypot(px - x, py - y), dn = Math.hypot(nx - x, ny - y);
    const rp = Math.min(r, dp / 2), rn = Math.min(r, dn / 2);
    const ax = x + (px - x) / dp * rp, ay = y + (py - y) / dp * rp;
    const bx = x + (nx - x) / dn * rn, by = y + (ny - y) / dn * rn;
    const steps = r > 0.04 ? 7 : 2;
    for (let k = 0; k <= steps; k++) {                     // quadratic curve a -> (corner) -> b
      const t = k / steps, u = 1 - t;
      out.push({ x: u * u * ax + 2 * u * t * x + t * t * bx, y: u * u * ay + 2 * u * t * y + t * t * by, wrap });
    }
  }
  return out;
}

// Extrudes the outline across the cabinet width. Returns the two side faces (uv-mapped for the side art) and the
// edge walls (smooth-shaded around the bevel and the rounded corners, hard on the sharp corners).
function cabBodyGeometry(outline) {
  const shape = new THREE.Shape(outline.map((p) => new THREE.Vector2(p.x, p.y)));
  const depth = CAB_W - 2 * CAB_BEVEL;
  const ext = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: CAB_BEVEL, bevelSize: CAB_BEVEL, bevelOffset: -CAB_BEVEL, bevelSegments: 3,
  });
  // Shape space (x = z, y, extrusion = -x)  ->  cabinet space.
  ext.applyMatrix4(new THREE.Matrix4().makeRotationY(-Math.PI / 2).setPosition(depth / 2, 0, 0));

  const slice = (attr, g, size) => attr.array.slice(g.start * size, (g.start + g.count) * size);
  const lids = ext.groups.find((g) => g.materialIndex === 0), sides = ext.groups.find((g) => g.materialIndex === 1);

  const cap = new THREE.BufferGeometry();
  const capPos = slice(ext.attributes.position, lids, 3);
  cap.setAttribute('position', new THREE.BufferAttribute(capPos, 3));
  cap.setAttribute('normal', new THREE.BufferAttribute(slice(ext.attributes.normal, lids, 3), 3));
  const zMin = CAB_BACK, zMax = Math.max(...outline.map((p) => p.x)), yMax = Math.max(...outline.map((p) => p.y));
  const uv = new Float32Array((capPos.length / 3) * 2);
  for (let i = 0; i < capPos.length / 3; i++) {             // front on the left when seen from either side
    const x = capPos[i * 3], y = capPos[i * 3 + 1], z = capPos[i * 3 + 2];
    uv[i * 2] = x > 0 ? (zMax - z) / (zMax - zMin) : (z - zMin) / (zMax - zMin);
    uv[i * 2 + 1] = y / yMax;
  }
  cap.setAttribute('uv', new THREE.BufferAttribute(uv, 2));

  let wall = new THREE.BufferGeometry();
  wall.setAttribute('position', new THREE.BufferAttribute(slice(ext.attributes.position, sides, 3), 3));
  wall.setAttribute('normal', new THREE.BufferAttribute(slice(ext.attributes.normal, sides, 3), 3));
  wall = CabGeoUtils.toCreasedNormals(wall, 0.75);
  ext.dispose();
  return { cap, wall };
}

// T-molding: a thin strip hugging both side panels along the front edge, in one white geometry that is tinted
// per cabinet through instanceColor. Plus lit bars across the deck lip, the marquee foot and above the kick plate.
function cabMoldGeometry(outline, frames, s) {
  const parts = [];
  for (let i = 0; i < outline.length; i++) {
    const a = outline[i], b = outline[(i + 1) % outline.length];
    if (!a.wrap || !b.wrap) continue;
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) + 0.008, ang = Math.atan2(dx, dy);
    if (len < 0.02) continue;                                // tiny corner segments are covered by their neighbours
    const mid = new THREE.Vector3(0, (a.y + b.y) / 2, (a.x + b.x) / 2);
    for (const side of [-1, 1]) {
      const m = cabTranslate(side * (CAB_W / 2 - 0.004), mid.y, mid.z).multiply(new THREE.Matrix4().makeRotationX(ang));
      parts.push(cabPart(new THREE.BoxGeometry(0.016, len, 0.012), 0xffffff, m));
    }
  }
  const d = s.deck;
  parts.push(cabPart(new THREE.BoxGeometry(0.84, 0.018, 0.01), 0xffffff, cabTranslate(0, (d.lipY0 + d.lipY1) / 2 - 0.005, d.lipX + 0.006)));
  const mq = frames.marquee;
  parts.push(cabPart(new THREE.BoxGeometry(0.84, 0.006, 0.01), 0xffffff, cabPlace(mq, 0, 0.052, 0.006)));
  parts.push(cabPart(new THREE.BoxGeometry(0.80, 0.008, 0.008), 0xffffff, cabTranslate(0, 0.115, d.underX + 0.003)));   // above the kick plate
  return CabGeoUtils.mergeGeometries(parts);
}

// ── Detail groups (each pushes vertex-coloured parts into `trim` = dull shell, `lit` = glowing) ──

// Bezel: dark frame with a rounded opening, an instruction card and screws. Sits in front of the recessed CRT.
function cabAddBezel(ctx) {
  const { trim, frames } = ctx, bay = frames.bay, [ow, oh] = CAB_SCREEN.hole;
  const shape = new THREE.Shape();
  cabTraceRoundRect(shape, 0.42, 0.2925, 0.015);
  const hole = new THREE.Path();
  cabTraceRoundRect(hole, ow / 2, oh / 2, 0.035);
  shape.holes.push(hole);
  const frame = new THREE.ExtrudeGeometry(shape, {
    depth: 0.008, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.004, bevelSegments: 1, curveSegments: 3,
  });
  trim(frame, 0x0b0b10, cabPlace(bay, 0, bay.len / 2, 0.020));
  const front = 0.0335;                                          // just in front of the frame face
  trim(new THREE.PlaneGeometry(0.15, 0.034), 0xd8d1b6, cabPlace(bay, -0.24, 0.031, front));        // instruction card
  trim(new THREE.PlaneGeometry(0.15, 0.008), 0xc2263a, cabPlace(bay, -0.24, 0.043, front + 0.0005));
  for (const sx of [-0.395, 0.395]) for (const t of [0.03, bay.len - 0.03]) {
    trim(new THREE.CylinderGeometry(0.006, 0.006, 0.004, 8), 0x9a9eaa, cabPlace(bay, sx, t, front, Math.PI / 2));
  }
}

// Kick plate with scuffs, a few scratches and stickers on the lower front.

// Coin door: steel plate, two coin mechs with backlit slots and return buttons, coin return flap and lock.

// Joysticks, lit buttons, start buttons and (style 2) a trackball on the control deck.
function cabAddControls(ctx) {
  const { trim, lit, frames, s } = ctx, deck = frames.deck, layout = CAB_CONTROLS[s.controls];
  const along = (f) => f * deck.len;
  for (const side of [-1, 1]) {
    const [su, st] = layout.stick;
    trim(new THREE.CylinderGeometry(0.052, 0.056, 0.008, 12), 0x0d0d12, cabPlace(deck, side * -su, along(st), 0.008, Math.PI / 2));
    trim(new THREE.CylinderGeometry(0.008, 0.008, 0.07, 6), 0xb4b8c4, cabPlace(deck, side * -su, along(st), 0.045, Math.PI / 2));
    trim(new THREE.SphereGeometry(0.028, 10, 7), side < 0 ? 0xd81820 : 0x2050e0, cabPlace(deck, side * -su, along(st), 0.093));
    layout.buttons.forEach(([u, t], i) => {
      const bu = side * -u, hue = CAB_BUTTONS[(i + (side < 0 ? 0 : 2)) % CAB_BUTTONS.length];
      trim(new THREE.CylinderGeometry(0.021, 0.021, 0.008, 10), 0x0d0d12, cabPlace(deck, bu, along(t), 0.008, Math.PI / 2));
      lit(new THREE.CylinderGeometry(0.0155, 0.017, 0.012, 10), hue, cabPlace(deck, bu, along(t), 0.012, Math.PI / 2), 1.5);
    });
    trim(new THREE.CylinderGeometry(0.016, 0.016, 0.008, 8), 0x0d0d12, cabPlace(deck, side * 0.045, along(0.13), 0.008, Math.PI / 2));
    lit(new THREE.CylinderGeometry(0.0115, 0.0125, 0.01, 8), side < 0 ? 0xffffff : 0x40a0ff, cabPlace(deck, side * 0.045, along(0.13), 0.011, Math.PI / 2), 1.4);
  }
  if (layout.trackball) {
    const [tu, tt] = layout.trackball;
    trim(new THREE.CylinderGeometry(0.058, 0.062, 0.01, 14), 0x1a1a22, cabPlace(deck, tu, along(tt), 0.008, Math.PI / 2));
    trim(new THREE.SphereGeometry(0.04, 12, 8), 0x15151b, cabPlace(deck, tu, along(tt), 0.026));
    lit(new THREE.TorusGeometry(0.05, 0.0035, 4, 16), 0x00e5ff, cabPlace(deck, tu, along(tt), 0.014), 1.8);
  }
}

// ── Shared, per-style kit: geometry + instanced batches ──
class CabBatch {
  // One InstancedMesh for a shared geometry/material; `tinted` batches also get a colour per instance.
  constructor(geometry, material, tinted = false) {
    this.geometry = geometry; this.material = material; this.tinted = tinted;
    this.count = 0; this.capacity = 0; this.mesh = null;
    this.grow(CAB_BATCH_START);
  }
  grow(capacity) {
    const old = this.mesh, mesh = new THREE.InstancedMesh(this.geometry, this.material, capacity);
    mesh.count = this.count;
    if (this.tinted) mesh.setColorAt(0, _cabWhite);              // allocates instanceColor
    if (old) {
      mesh.instanceMatrix.array.set(old.instanceMatrix.array);
      if (this.tinted) mesh.instanceColor.array.set(old.instanceColor.array);
      cabRoot().remove(old);
      old.dispose();
    }
    cabRoot().add(mesh);
    this.mesh = mesh; this.capacity = capacity;
  }
  add(matrix, color = _cabWhite) {
    if (this.count === this.capacity) this.grow(this.capacity * 2);
    const m = this.mesh;
    m.setMatrixAt(this.count, matrix);
    if (this.tinted) { m.setColorAt(this.count, color); m.instanceColor.needsUpdate = true; }
    m.count = ++this.count;
    m.instanceMatrix.needsUpdate = true;
    m.computeBoundingSphere();                                   // keeps frustum culling correct as instances are added
  }
}

let _cabRoot = null;
function cabRoot() {
  if (!_cabRoot) { _cabRoot = new THREE.Group(); _cabRoot.name = 'cabinets'; scene.add(_cabRoot); }
  return _cabRoot;
}

// Everything shared by all cabinets: CRT / glass geometry, materials, glass batch.
let _cabShared = null;
function cabShared() {
  if (_cabShared) return _cabShared;
  const bay = cabFrame([CAB_BAY.x0, CAB_BAY.y0], [CAB_BAY.x1, CAB_BAY.y1]);
  const dome = (w, h, sx, sy, bulge, offset) => {                // subdivided plane bulging towards the viewer
    const g = new THREE.PlaneGeometry(w, h, sx, sy), p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const nx = p.getX(i) / (w / 2), ny = p.getY(i) / (h / 2);
      p.setZ(i, bulge * (1 - nx * nx) * (1 - ny * ny));
    }
    g.computeVertexNormals();
    g.applyMatrix4(cabPlace(bay, 0, bay.len / 2, offset));
    return g;
  };
  const screenGeo = dome(CAB_SCREEN.w, CAB_SCREEN.h, 12, 9, CAB_SCREEN.bulge, 0.004);
  const glassGeo = dome(0.84, 0.585, 8, 6, 0.010, 0.040);
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x000000, roughness: 0.26, metalness: 0,              // black + additive: only reflections and sheen add light
    emissive: 0xffffff, emissiveMap: cabSheenTexture(), emissiveIntensity: 0.25,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
  });
  _cabShared = {
    screenGeo,
    glass: new CabBatch(glassGeo, glassMat),
    shellMat: new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, metalness: 0.2 }),
    glowMat: new THREE.MeshBasicMaterial({ vertexColors: true }),
    moldMat: new THREE.MeshBasicMaterial({}),
  };
  return _cabShared;
}

// Soft diagonal streaks + smudges, the "window reflection" on the tube glass.
function cabSheenTexture() {
  const { canvas, ctx } = makeCanvas(128, 128);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 128, 128);
  ctx.save(); ctx.translate(64, 64); ctx.rotate(-0.62);
  for (const [x, w, a] of [[-26, 30, 0.34], [18, 9, 0.20], [34, 4, 0.14]]) {
    const g = ctx.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(x - w, -120, w * 2, 240);
  }
  ctx.restore();
  const r = rng(7);
  for (let i = 0; i < 5; i++) {                                  // fingerprints / dust
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 14);
    g.addColorStop(0, 'rgba(255,255,255,0.10)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save(); ctx.translate(r() * 128, r() * 128); ctx.scale(1, 0.6); ctx.fillStyle = g; ctx.fillRect(-14, -14, 28, 28); ctx.restore();
  }
  return canvasTexture(canvas, { anisotropy: 1 });
}

const _cabKits = [];
function cabKit(styleIndex) {
  return _cabKits[styleIndex] || (_cabKits[styleIndex] = cabBuildKit(styleIndex));
}

function cabBuildKit(styleIndex) {
  const s = CAB_STYLES[styleIndex], d = s.deck, m = s.marquee, b = CAB_BAY, shared = cabShared();
  const outline = cabOutline(cabProfile(s));
  const { cap, wall } = cabBodyGeometry(outline);
  const frames = {
    kick: cabFrame([0.30, 0], [0.30, 0.11]),
    lower: cabFrame([d.underX, 0.11], [d.underX, d.underY]),
    deck: cabFrame([d.lipX, d.lipY1], [b.x0, b.y0]),
    bay: cabFrame([b.x0, b.y0], [b.x1, b.y1]),
    marquee: cabFrame([m.lowX, b.y1], [m.highX, m.roofY]),
  };

  const shell = [cabPart(wall, s.body)], glow = [];
  const ctx = {
    s, frames, rand: rng(4242 + styleIndex * 97),
    trim: (geo, hex, matrix) => shell.push(cabPart(geo, hex, matrix)),
    lit: (geo, hex, matrix, gain) => glow.push(cabPart(geo, hex, matrix, gain)),
  };
  cabAddBezel(ctx); cabAddGrille(ctx); cabAddWear(ctx); cabAddCoinDoor(ctx); cabAddControls(ctx);

  // Printed art planes: control-panel decal on the deck, lit marquee on the slanted marquee face.
  const deckGeo = new THREE.PlaneGeometry(0.84, frames.deck.len - 0.08);
  deckGeo.applyMatrix4(cabPlace(frames.deck, 0, frames.deck.len / 2, 0.003));
  const marqueeGeo = new THREE.PlaneGeometry(0.84, 0.21);
  marqueeGeo.applyMatrix4(cabPlace(frames.marquee, 0, 0.16, 0.004));

  return {
    capGeo: cap, deckGeo, marqueeGeo,
    shell: new CabBatch(CabGeoUtils.mergeGeometries(shell), shared.shellMat, true),
    glow: new CabBatch(CabGeoUtils.mergeGeometries(glow), shared.glowMat),
    mold: new CabBatch(cabMoldGeometry(outline, frames, s), shared.moldMat, true),
  };
}

// ── Per-game materials (shared by every cabinet showing the same game) ──
const _cabArts = new Map();
function cabArtKit(artIndex) {
  const limit = Math.max(1, Math.min(CAB_ART_LIMIT, GAME_COUNT));
  const key = ((artIndex % limit) + limit) % limit;
  let kit = _cabArts.get(key);
  if (kit) return kit;
  const art = makeCabinetArt(key);
  kit = {
    art,
    sideMat: new THREE.MeshStandardMaterial({                     // glossy vinyl print
      map: art.sideTex, roughness: 0.38, metalness: 0, emissive: 0xffffff, emissiveMap: art.sideTex, emissiveIntensity: 0.18,
    }),
    panelMat: new THREE.MeshStandardMaterial({
      map: art.panelTex, roughness: 0.3, metalness: 0, emissive: 0xffffff, emissiveMap: art.panelTex, emissiveIntensity: 0.3,
    }),
    marqueeMat: cabPatchedBasic(art.marqueeTex, 1.3, 'cab-marquee', `
      diffuseColor.rgb *= (0.84 + 0.16 * sin(vMapUv.y * 3.14159)) * (0.90 + 0.10 * sin(vMapUv.x * 3.14159));`),
    screenMat: cabPatchedBasic(art.screenTex, 1.2, 'cab-screen', `
      vec2 cq = vMapUv - 0.5;
      float cr = dot(cq, cq) * 4.0;                                  // 0 in the middle, 2 in the corners
      float scan = sin(vMapUv.y * 192.0 * 6.28318);                  // scanlines, faded out when they would alias
      float aa = 1.0 - smoothstep(0.1, 0.5, fwidth(vMapUv.y) * 192.0);
      diffuseColor.rgb *= (1.0 - 0.40 * smoothstep(0.25, 1.6, cr)) * (1.0 + 0.10 * (1.0 - smoothstep(0.0, 1.0, cr)))
                        * (1.0 - 0.14 * aa * (0.5 + 0.5 * scan));`),
  };
  _cabArts.set(key, kit);
  return kit;
}

// Unlit (emissive-looking) textured material with a small fragment tweak (vignette, scanlines, light-box falloff).
function cabPatchedBasic(map, gain, cacheKey, glsl) {
  const mat = new THREE.MeshBasicMaterial({ map, color: new THREE.Color(gain, gain, gain) });
  mat.onBeforeCompile = (shader) => {
    shader.fragmentShader = shader.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>\n${glsl}`);
  };
  mat.customProgramCacheKey = () => cacheKey;
  return mat;
}

// ── Floor decals: soft contact shadows and coloured light pools, merged for the whole arcade ──
const _cabDecals = [];
let _cabFloorMeshes = null, _cabFloorTextures = null, _cabDeferFloor = false;
const _cabFloorMats = {};                                        // created on first use, reused when the decals are rebuilt

function cabFloorTextures() {
  if (_cabFloorTextures) return _cabFloorTextures;
  const sh = makeCanvas(128, 128);                               // soft rectangle
  sh.ctx.shadowColor = '#000'; sh.ctx.shadowBlur = 16; sh.ctx.shadowOffsetX = 1000;
  sh.ctx.fillStyle = '#000'; sh.ctx.fillRect(-1000 + 30, 28, 68, 72);
  const pool = makeCanvas(128, 128);                             // radial falloff
  const g = pool.ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.7, 'rgba(255,255,255,0.14)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  pool.ctx.fillStyle = g; pool.ctx.fillRect(0, 0, 128, 128);
  _cabFloorTextures = { shadow: canvasTexture(sh.canvas, { anisotropy: 1 }), pool: canvasTexture(pool.canvas, { anisotropy: 1 }) };
  return _cabFloorTextures;
}

// One merged quad list. across/along: half sizes; centre: offset along the cabinet's facing direction.
function cabDecalGeometry(across, along, centre, y, colorOf) {
  const n = _cabDecals.length;
  const pos = new Float32Array(n * 12), uv = new Float32Array(n * 8), idx = new Uint16Array(n * 6);
  const col = colorOf ? new Float32Array(n * 12) : null;
  const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  _cabDecals.forEach((dc, i) => {
    const s = Math.sin(dc.rot), c = Math.cos(dc.rot);             // facing (s, c), right (c, -s) on the floor plane
    const cx = dc.x + s * centre, cz = dc.z + c * centre;
    corners.forEach(([a, l], k) => {
      const v = i * 4 + k;
      pos.set([cx + c * a * across + s * l * along, y, cz - s * a * across + c * l * along], v * 3);
      uv.set([(a + 1) / 2, (l + 1) / 2], v * 2);
      if (col) col.set(colorOf(dc), v * 3);
    });
    idx.set([i * 4, i * 4 + 1, i * 4 + 2, i * 4, i * 4 + 2, i * 4 + 3], i * 6);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  if (col) g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}

function cabRebuildFloor() {
  const tex = cabFloorTextures();
  if (_cabFloorMeshes) for (const mesh of _cabFloorMeshes) { cabRoot().remove(mesh); mesh.geometry.dispose(); }
  const common = { transparent: true, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 };
  const shadow = new THREE.Mesh(
    cabDecalGeometry(0.70, 0.74, 0.075, 0.004, null),
    _cabFloorMats.shadow || (_cabFloorMats.shadow = new THREE.MeshBasicMaterial({ map: tex.shadow, color: 0x000000, opacity: 0.85, ...common })));
  const pool = new THREE.Mesh(
    cabDecalGeometry(1.15, 0.75, 1.15, 0.006, (dc) => dc.glow),
    _cabFloorMats.pool || (_cabFloorMats.pool = new THREE.MeshBasicMaterial({ map: tex.pool, vertexColors: true, blending: THREE.AdditiveBlending, fog: false, ...common })));
  for (const mesh of [shadow, pool]) { mesh.renderOrder = -1; mesh.frustumCulled = false; cabRoot().add(mesh); }
  _cabFloorMeshes = [shadow, pool];
}

// ── Placing cabinets ──
const _cabQuat = new THREE.Quaternion(), _cabUp = new THREE.Vector3(0, 1, 0), _cabOne = new THREE.Vector3(1, 1, 1);
let _cabCounter = 0;

// Builds one cabinet, places it at (x, z) turned by rotY, registers its collider and returns the group of its own meshes.
function addCabinet(x, z, rotY, artIndex) {
  const cab = cabBuild(x, z, rotY, artIndex);
  if (!_cabDeferFloor) cabRebuildFloor();
  return cab;
}

function cabBuild(x, z, rotY, artIndex) {
  const shared = cabShared();
  const n = _cabCounter++;
  const kit = cabKit((n + (n >> 2)) % CAB_STYLES.length);         // styles alternate along a row
  const arts = cabArtKit(artIndex), art = arts.art;
  const rand = rng(Math.round(x * 100) * 7919 + Math.round(z * 100) * 104729 + n);

  // Instanced parts (shell, glow, T-molding, glass): one matrix per cabinet, slight random tint on shell and molding.
  const matrix = new THREE.Matrix4().compose(new THREE.Vector3(x, 0, z), _cabQuat.setFromAxisAngle(_cabUp, rotY), _cabOne);
  const k = 0.82 + rand() * 0.36;
  const tint = new THREE.Color(k * (0.94 + rand() * 0.12), k * (0.94 + rand() * 0.12), k * (0.94 + rand() * 0.12));
  const neon = new THREE.Color(art.color);
  const glowTint = new THREE.Color(neon.r, neon.g, neon.b).multiplyScalar(1.25 * (0.9 + rand() * 0.2));
  kit.shell.add(matrix, tint); kit.glow.add(matrix); kit.mold.add(matrix, glowTint); shared.glass.add(matrix);

  // Own meshes: side art, control-panel decal, marquee and CRT. Static, so their matrices are computed once.
  const cab = new THREE.Group();
  cab.position.set(x, 0, z);
  cab.rotation.y = rotY;
  cab.matrixAutoUpdate = false;
  cab.updateMatrix();
  for (const [geo, mat] of [[kit.capGeo, arts.sideMat], [kit.deckGeo, arts.panelMat], [kit.marqueeGeo, arts.marqueeMat], [shared.screenGeo, arts.screenMat]]) {
    const mesh = new THREE.Mesh(geo, mat);
    mesh.matrixAutoUpdate = false;
    cab.add(mesh);
  }
  cabRoot().add(cab);

  cabAddCollider(x, z, rotY);
  _cabDecals.push({ x, z, rot: rotY, glow: [neon.r * 0.26, neon.g * 0.26, neon.b * 0.26] });
  registry.cabinets.push({ x, z, rot: rotY, color: art.color, name: art.name, art });
  return cab;
}

// Collision box: rotate the footprint (including the control-deck overhang) into world space, take its bounding box.
function cabAddCollider(x, z, rotY) {
  const c = Math.cos(rotY), s = Math.sin(rotY), xs = [], zs = [];
  for (const [lx, lz] of [[-CAB_W / 2, CAB_BACK], [CAB_W / 2, CAB_BACK], [CAB_W / 2, CAB_FRONT], [-CAB_W / 2, CAB_FRONT]]) {
    xs.push(x + lx * c + lz * s);
    zs.push(z - lx * s + lz * c);
  }
  addCollider(Math.min(...xs), Math.max(...xs), Math.min(...zs), Math.max(...zs));
}

// Layout (zones in CONTRACT.md): west wall strip, central island, west-centre island. 24 cabinets, 1.05 m pitch.
function buildCabinets() {
  _cabDeferFloor = true;
  const PITCH = 1.05, BACK_GAP = 0.03;
  let game = 0;                                                  // next game (art index); wraps after CAB_ART_LIMIT
  const row = (count, at, rot) => { for (let k = 0; k < count; k++) { const [x, z] = at(k); addCabinet(x, z, rot, game++); } };
  const centred = (k, n) => (k - (n - 1) / 2) * PITCH;

  // West wall strip, facing east (+x)
  row(8, (k) => [-ROOM.w / 2 - CAB_BACK + BACK_GAP, centred(k, 8)], Math.PI / 2);
  // Central island: two back-to-back rows of four, facing +z and -z
  row(4, (k) => [centred(k, 4), -CAB_BACK], 0);
  row(4, (k) => [centred(k, 4), CAB_BACK], Math.PI);
  // West-centre island: two back-to-back rows of four, facing west (-x) and east (+x)
  row(4, (k) => [-5.5 + CAB_BACK, centred(k, 4)], -Math.PI / 2);
  row(4, (k) => [-5.5 - CAB_BACK, centred(k, 4)], Math.PI / 2);

  _cabDeferFloor = false;
  cabRebuildFloor();
}

// ── 3. Small helpers ──
const scrClamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const scrEase = (x) => { x = scrClamp(x); return x * x * (3 - 2 * x); };            // smoothstep
const scrTri = (x) => { const m = ((x % 2) + 2) % 2; return m < 1 ? m : 2 - m; };    // triangle wave 0..1..0, period 2
const scrLerp = (a, b, k) => a + (b - a) * k;
// Stateless noise in [0,1): the same input always gives the same output (animation = pure function of time).
function scrHash(n) {

  n = Math.imul(n ^ (n >>> 12), 0x297a2d39);
  return ((n ^ (n >>> 15)) >>> 0) / 4294967296;

const _scrP = { x: 0, y: 0, dx: 0, dy: 0 };     // scratch output shared by helpers, so per-frame code never allocates

// Pixel-snapped filled rectangle (fractions are rounded so edges never blur).
function scrRect(g, col, x, y, w, h) {
  const x0 = Math.round(x), y0 = Math.round(y);

  g.fillRect(x0, y0, Math.round(x + w) - x0, Math.round(y + h) - y0);

// Filled disc built from pixel spans (crisp, no anti-aliasing).
function scrDisc(g, col, cx, cy, r) {

}
// Draws `draw(ctx)` into a new canvas (default screen size) with smoothing off, and returns the canvas.
function scrLayer(draw, w = SCR_W, h = SCR_H) {

}
// Closed polyline path with arc-length lookup: scrPathAt(path, distance) -> _scrP {x, y, dx, dy}.
function scrMakePath(pts) {

function scrPathAt(path, d, out = _scrP) {

const ASTRO_WAVES = 4, ASTRO_PER_WAVE = 5;

// ── 9. Backdrops and lettering (shared by title screens, marquees and side decals) ──
// Paints a w x h backdrop in one of the named styles using the game palette [main, accent, dark, background].
function scrBackdrop(g, w, h, style, pal) {
  const a = pal[0], b = pal[1], c = pal[2], bg = pal[3];
  const grad = (y0, y1, stops) => {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    for (let i = 0; i < stops.length; i += 2) gr.addColorStop(stops[i], stops[i + 1]);
    return gr;
  };
  g.save();
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  switch (style) {
    case 'stars': {
      g.fillStyle = grad(0, h, [0, bg, 1, c]); g.fillRect(0, 0, w, h);
      const nb = g.createRadialGradient(w * 0.3, h * 0.35, 0, w * 0.3, h * 0.35, w * 0.55);
      nb.addColorStop(0, a + '55'); nb.addColorStop(1, a + '00'); g.fillStyle = nb; g.fillRect(0, 0, w, h);
      for (let i = 0, n = Math.floor((w * h) / 380); i < n; i++) {
        const s = scrHash(i * 3 + 1);
        scrRect(g, s > 0.92 ? b : '#ffffff', scrHash(i * 3 + 2) * w, scrHash(i * 3 + 3) * h, s > 0.97 ? 2 : 1, s > 0.97 ? 2 : 1);
      }
      const r = Math.min(w, h) * 0.22, px = w * 0.82, py = h * 0.74;
      const pl = g.createRadialGradient(px - r * 0.4, py - r * 0.4, r * 0.1, px, py, r);
      pl.addColorStop(0, b); pl.addColorStop(1, c); g.fillStyle = pl; g.beginPath(); g.arc(px, py, r, 0, 6.2832); g.fill();
      g.strokeStyle = a; g.lineWidth = Math.max(1, r * 0.08); g.beginPath(); g.ellipse(px, py, r * 1.7, r * 0.35, -0.35, 0, 6.2832); g.stroke();
      break;
    }
    case 'sunset': {
      const hz = h * 0.62;
      g.fillStyle = grad(0, hz, [0, bg, 0.5, c, 0.85, a, 1, b]); g.fillRect(0, 0, w, hz);
      const sr = Math.min(w * 0.3, hz * 0.62);
      g.fillStyle = grad(hz - sr, hz, [0, '#fff17a', 1, a]); g.beginPath(); g.arc(w / 2, hz, sr, Math.PI, 2 * Math.PI); g.fill();
      g.fillStyle = grad(0, hz, [0, bg, 0.5, c, 0.85, a, 1, b]);
      for (let i = 0; i < 6; i++) g.fillRect(w / 2 - sr, hz - 4 - i * sr * 0.15, sr * 2, 1 + i * 0.6);
      g.fillStyle = bg; g.fillRect(0, hz, w, h - hz);
      g.strokeStyle = b; g.lineWidth = 1; g.globalAlpha = 0.6; g.beginPath();
      for (let i = -10; i <= 10; i++) { g.moveTo(w / 2 + i * 6, hz); g.lineTo(w / 2 + i * w * 0.14, h); }
      for (let r = 1; r <= 6; r++) { const y = hz + (h - hz) * (r / 6) * (r / 6); g.moveTo(0, y); g.lineTo(w, y); }
      g.stroke();
      break;
    }
    case 'grid': {
      g.fillStyle = grad(0, h, [0, bg, 1, c]); g.fillRect(0, 0, w, h);
      g.strokeStyle = b; g.lineWidth = 1; g.globalAlpha = 0.35; g.beginPath();
      for (let x = 0; x <= w; x += 16) { g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); }
      for (let y = 0; y <= h; y += 16) { g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); }
      g.stroke(); g.globalAlpha = 0.9; g.strokeStyle = a; g.lineWidth = 2; g.strokeRect(4, 4, w - 8, h - 8);
      break;
    }
    case 'city': {
      const hz = h * 0.72;
      g.fillStyle = grad(0, hz, [0, bg, 0.6, c, 1, a]); g.fillRect(0, 0, w, hz);
      const mr = Math.min(w, h) * 0.11; g.fillStyle = '#ffe8f6'; g.beginPath(); g.arc(w * 0.76, h * 0.22, mr, 0, 6.2832); g.fill();
      for (let x = 0, i = 0; x < w; i++) {
        const bw = 10 + (i % 4) * 5, bh = h * (0.12 + scrHash(i + 3) * 0.32);
        g.fillStyle = i % 2 ? '#140a2c' : '#1c0e3a'; g.fillRect(x, hz - bh, bw, bh + 1);
        for (let wy = hz - bh + 4; wy < hz - 3; wy += 6) for (let wx = x + 2; wx < x + bw - 2; wx += 4) if (scrHash(wx * 7 + wy * 3 + i) > 0.65) scrRect(g, scrHash(wx + wy) > 0.5 ? '#ffe680' : b, wx, wy, 2, 3);
        x += bw;
      }
      g.fillStyle = '#0a0518'; g.fillRect(0, hz, w, h - hz); scrRect(g, a, 0, hz, w, 2);
      break;
    }
    case 'sky': {
      g.fillStyle = grad(0, h, [0, '#2a7bff', 0.65, '#9fdcff', 1, '#d8f4ff']); g.fillRect(0, 0, w, h);
      g.fillStyle = '#ffffff';
      for (let i = 0; i < 5; i++) { const cx = scrHash(i + 11) * w, cy = scrHash(i + 21) * h * 0.5, r = Math.min(w, h) * 0.07;
      for (let b = 0; b < 3; b++) { g.beginPath(); g.arc(cx + (b - 1) * r, cy + (b & 1) * -r * 0.3, r, 0, 6.2832); g.fill(); } }
      g.fillStyle = grad(h * 0.6, h, [0, a, 1, c]); g.beginPath(); g.moveTo(0, h);
      for (let x = 0; x <= w; x += 4) g.lineTo(x, h * 0.78 + Math.sin(x * 0.03) * h * 0.06);
      g.lineTo(w, h); g.fill();
      break;
    }
    case 'burst': {
      const ox = w / 2, oy = h * 0.55, n = 22, R = Math.hypot(w, h);
      for (let i = 0; i < n; i++) {
        g.fillStyle = i & 1 ? c : bg; g.beginPath(); g.moveTo(ox, oy);
        g.lineTo(ox + Math.cos((i / n) * 6.2832) * R, oy + Math.sin((i / n) * 6.2832) * R);
        g.lineTo(ox + Math.cos(((i + 1) / n) * 6.2832) * R, oy + Math.sin(((i + 1) / n) * 6.2832) * R); g.fill();
      }
      const gl = g.createRadialGradient(ox, oy, 0, ox, oy, Math.max(w, h) * 0.6);
      gl.addColorStop(0, a + 'aa'); gl.addColorStop(1, a + '00'); g.fillStyle = gl; g.fillRect(0, 0, w, h);
      break;
    }
    case 'checker': {
      const s = Math.max(8, Math.round(Math.min(w, h) / 12));
      for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) if (((x / s) + (y / s)) & 1) scrRect(g, c, x, y, s, s);
      g.fillStyle = grad(0, h, [0, bg + 'ee', 0.5, bg + '00', 1, bg + 'cc']); g.fillRect(0, 0, w, h);
      g.strokeStyle = b; g.globalAlpha = 0.8; g.lineWidth = 2; g.strokeRect(3, 3, w - 6, h - 6);
      break;
    }
    case 'waves': {
      g.fillStyle = grad(0, h, [0, bg, 1, c]); g.fillRect(0, 0, w, h);
      for (let i = 0; i < 9; i++) {
        g.fillStyle = i % 2 ? a + '33' : b + '30'; g.beginPath(); g.moveTo(0, h);
        for (let x = 0; x <= w; x += 4) g.lineTo(x, h * (0.18 + i * 0.09) + Math.sin(x * 0.045 + i * 1.3) * h * 0.04);
        g.lineTo(w, h); g.fill();
      }
      break;
    }
    case 'stripes': {
      g.fillStyle = grad(0, h, [0, bg, 1, c]); g.fillRect(0, 0, w, h);
      const cols = [a, b, a, '#ffffff'], sw = Math.max(w, h) * 0.13;
      for (let i = 0; i < 4; i++) {
        g.fillStyle = cols[i]; g.globalAlpha = i === 3 ? 0.85 : 0.95; g.beginPath();
        const o = -h * 0.2 + i * sw * 1.5 + h * 0.15;
        g.moveTo(-w * 0.2, h * 0.75 + o); g.lineTo(w * 1.2, h * 0.1 + o - w * 0.2); g.lineTo(w * 1.2, h * 0.1 + o - w * 0.2 + sw * (i === 3 ? 0.12 : 0.9));
        g.lineTo(-w * 0.2, h * 0.75 + o + sw * (i === 3 ? 0.12 : 0.9)); g.fill();
      }
      break;
    }
    case 'chevron': {
      g.fillStyle = grad(0, h, [0, bg, 1, c]); g.fillRect(0, 0, w, h);
      const sp = Math.max(w, h) * 0.16;
      for (let i = -2; i < h / sp + 3; i++) {
        g.fillStyle = i & 1 ? a : b; g.globalAlpha = 0.9; g.beginPath();
        const y = i * sp;
        g.moveTo(0, y); g.lineTo(w / 2, y + sp * 0.8); g.lineTo(w, y); g.lineTo(w, y + sp * 0.3); g.lineTo(w / 2, y + sp * 1.1); g.lineTo(0, y + sp * 0.3); g.fill();
      }
      break;
    }
    default: {
      g.fillStyle = grad(0, h, [0, bg, 1, c]); g.fillRect(0, 0, w, h);
    }
  }
  g.restore();
}

const SCR_LOGO_FONT = '"Arial Black", Impact, "Helvetica Neue", Arial, sans-serif';
// Chrome-style logo lettering: glow, extrusion, dark outline, gradient face, highlight. lines = array of strings.
// pixel = true uses the arcade pixel font (screen titles); false uses a heavy italic face (marquee, side decal).
function scrLogo(g, lines, cx, cy, maxW, maxH, pal, pixel) {
  const family = pixel ? ARCADE_FONT : SCR_LOGO_FONT, face = pixel ? '' : 'italic 900 ';
  g.save();
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  let size = maxH / lines.length;
  for (let i = 0; i < lines.length; i++) {
    g.font = face + size + 'px ' + family;
    const w = g.measureText(lines[i]).width;
    if (w > maxW) size *= maxW / w;
  }
  size = Math.floor(size);
  g.font = face + size + 'px ' + family;
  const lh = size * (pixel ? 1.2 : 0.98), y0 = cy - ((lines.length - 1) * lh) / 2, depth = Math.max(2, Math.round(size * 0.1));
  for (let i = 0; i < lines.length; i++) {
    const y = y0 + i * lh, s = lines[i];
    g.shadowColor = pal[0]; g.shadowBlur = size * 0.4;                               // neon glow under everything
    g.strokeStyle = '#05030a'; g.lineWidth = size * 0.2; g.strokeText(s, cx, y + depth * 0.5);
    g.shadowBlur = 0; g.shadowColor = 'transparent';
    g.fillStyle = pal[2];
    for (let d = depth; d >= 1; d--) g.fillText(s, cx + d * 0.6, y + d);              // extrusion
    g.strokeStyle = '#05030a'; g.lineWidth = size * 0.16; g.strokeText(s, cx, y);
    const gr = g.createLinearGradient(0, y - size * 0.5, 0, y + size * 0.5);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.3, pal[1]); gr.addColorStop(0.5, pal[0]); gr.addColorStop(0.53, pal[2]); gr.addColorStop(1, pal[0]);
    g.fillStyle = gr; g.fillText(s, cx, y);
    g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 1; g.strokeText(s, cx, y);
  }
  g.restore();
}

// Small four-point sparkle used on titles and decals.
function scrSparkle(g, x, y, r, col) {
  scrRect(g, col, x - r, y, r * 2 + 1, 1); scrRect(g, col, x, y - r, 1, r * 2 + 1);
  scrRect(g, col, x - r / 2, y - r / 2, r + 1, r + 1);
}

// ── 10. Static screens: title, high scores, insert coin ──
const SCR_NAMES = ['ACE', 'BOB', 'CAT', 'DJK', 'ELI', 'FOX', 'GUS', 'JAM', 'KAY', 'LEO', 'MAX', 'NEO', 'ZAP', 'RAY', 'SAM', 'TOM', 'VIC', 'WOW', 'ZED', 'MOE'];
const SCR_RANK_COLORS = ['#ff3b3b', '#ff8a1f', '#ffe600', '#39ff88', '#00e5ff', '#5b8bff', '#c06bff', '#ffffff'];

// Builds the layers that never change (backdrop, title, logo, high scores); re-run when the web font arrives.
function scrBuildStatics(def, A) {
  A.back = scrLayer((g) => scrBackdrop(g, SCR_W, SCR_H, def.titleStyle, def.pal));
  A.title = scrLayer((g) => {
    g.drawImage(A.back, 0, 0);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, 0, SCR_W, 20);
    scrText(g, 'NEON AMUSEMENT PRESENTS', 128, 7, '#c8c8e0', 1, 1);
    scrMascotBox(g, def, 128, 132, 110, 44);
    scrTextS(g, def.tag, 128, 100, def.pal[1], 1, 1);
    scrText(g, '1991 NEON AMUSEMENT', 128, 174, '#9a9ab8', 1, 1);
  });
  A.logo = scrLayer((g) => scrLogo(g, def.lines, 128, 56, 224, 72, def.pal, true));
  A.mascotImg = scrLayer((g) => scrMascotBox(g, def, 40, 40, 76, 44), 80, 80);
  if (!A.rows) {                                                                   // deterministic high-score table
    const r = rng(def.id.length * 977 + def.id.charCodeAt(0) * 31 + def.id.charCodeAt(2));
    let val = def.hs === 'time' ? 7200 + Math.floor(r() * 900) : 40000 + Math.floor(r() * 90000);
    A.rows = [];
    for (let i = 0; i < 8; i++) {
      A.rows.push({ name: SCR_NAMES[Math.floor(r() * SCR_NAMES.length)], val });
      val = def.hs === 'time' ? val + 150 + Math.floor(r() * 300) : Math.floor(val * (0.62 + r() * 0.3));
    }
  }
  A.scoresBg = scrLayer((g) => {                                                   // dimmed backdrop + header
    g.drawImage(A.back, 0, 0);
    g.fillStyle = 'rgba(0,0,0,0.72)'; g.fillRect(0, 0, SCR_W, SCR_H);
    scrTextS(g, def.hs === 'time' ? 'BEST TIMES' : 'HIGH SCORES', 128, 10, def.pal[1], 2, 1);
    scrRect(g, def.pal[0], 24, 30, 208, 2);
    scrText(g, 'TODAYS TOP PLAYERS', 128, 36, '#9a9ab8', 1, 1);
  });
  A.scores = scrLayer((g) => {                                                     // the same plus all eight rows
    g.drawImage(A.scoresBg, 0, 0);
    const ranks = ['1ST', '2ND', '3RD', '4TH', '5TH', '6TH', '7TH', '8TH'];
    for (let i = 0; i < 8; i++) {
      const y = 52 + i * 15, col = SCR_RANK_COLORS[i], v = A.rows[i].val;
      scrTextS(g, ranks[i], 36, y, col); scrTextS(g, A.rows[i].name, 96, y, col);
      const txt = def.hs === 'time' ? Math.floor(v / 6000) + "'" + String(Math.floor((v % 6000) / 100)).padStart(2, '0') + '"' + String(v % 100).padStart(2, '0') : String(v).padStart(6, '0');
      scrTextS(g, txt, 222, y, col, 1, 2);
    }
  });
}
function scrDrawTitle(g, def, A, pt) {
  g.drawImage(A.title, 0, 0);
  for (let i = 0; i < 5; i++) {                                                    // twinkles around the logo
    const ph = (pt * 1.6 + scrHash(i * 5)) % 1;

  }

}

// ── 11. Cabinet decals: marquee 512x128, side 256x512, control panel 512x192 (drawn once per game, shared) ──
function scrDrawMarquee(g, def) {
  const W = 512, H = 128;
  scrBackdrop(g, W, H, def.titleStyle, def.pal);
  const glow = g.createRadialGradient(256, 64, 10, 256, 64, 230);                  // backlight hot spot behind the logo
  glow.addColorStop(0, def.pal[0] + '66'); glow.addColorStop(1, def.pal[0] + '00');

  g.save(); g.translate(W, 0); g.scale(-1, 1); scrMascotBox(g, def, 58, 62, 88, 78); g.restore();      // mirrored partner on the right
  scrLogo(g, def.lines, 256, 62, 310, 92, def.pal, false);
  scrText(g, def.tag, 256, 113, '#ffffff', 1, 1);
  for (let i = 0; i < 6; i++) { scrSparkle(g, 110 + scrHash(i * 3) * 300, 12 + scrHash(i * 3 + 1) * 90, 2 + (i % 3), '#ffffff'); }
  const fr = g.createLinearGradient(0, 0, 0, H);                                   // coloured border with inner highlight
  fr.addColorStop(0, def.pal[1]); fr.addColorStop(1, def.pal[0]);
  g.strokeStyle = '#0a0812'; g.lineWidth = 10; g.strokeRect(0, 0, W, H);

  gl.addColorStop(0, 'rgba(255,255,255,0.28)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gl; g.fillRect(0, 0, W, H * 0.5);
}

function scrDrawSide(g, def) {

// ── 13. Screen instances, scheduler and the public entry point ──
const scrInstances = [];

const scrRand = rng(90210);

// Assets of a game: built lazily on first use, and rebuilt when the web font arrives (text baked into layers).
function scrAssets(def) {

    A = def.A = A || {};
    A.epoch = scrFontEpoch;

  }

}
// Draws one frame of a screen at time t (seconds) and uploads it.

  while (ph < 3 && c >= SCR_PHASES[ph]) { c -= SCR_PHASES[ph]; ph++; }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';

  else if (ph === 1) { g.fillStyle = '#000000'; g.fillRect(0, 0, SCR_W, SCR_H); def.demo(g, c, A); scrDemoFooter(g, c); }
  else if (ph === 2) scrDrawScores(g, def, A, c);

// Minimum seconds between redraws of this screen: Infinity when it is far, outside the view cone or facing away,

function scrGap(inst) {
  let p = inst.pos;
  if (!p) {                                                        // find our cabinet in the registry (registered after the art was made)
    if ((inst.lookups++ & 31) === 0) {
      for (let i = 0; i < registry.cabinets.length; i++) if (registry.cabinets[i].art && registry.cabinets[i].art.screenTex === inst.tex) { inst.pos = p = registry.cabinets[i]; break; }
    }
    if (!p) return 1 / SCR_FPS;                                    // unknown position: always visible (still throttled and capped)
  }
  const dx = p.x - player.x, dz = p.z - player.z, d2 = dx * dx + dz * dz;
  if (d2 > SCR_CULL_DIST * SCR_CULL_DIST || player.pitch > 1.0) return Infinity;   // far away, or looking at the ceiling (screens sit below eye level)
  const dot = dx * -Math.sin(player.yaw) + dz * -Math.cos(player.yaw);
  if (dot < (d2 > 4 ? 0.2 * Math.sqrt(d2) : -0.3)) return Infinity;   // behind, or well outside the view direction
  if (p.rot !== undefined && -dx * Math.sin(p.rot) - dz * Math.cos(p.rot) < -0.3) return Infinity;   // screen faces away

// Once per frame: pick a random recently-drawn cabinet for the next glitch, then redraw due screens (capped).
function scrTick(t) {

  if (t >= scrNextGlitch && n) {
    scrNextGlitch = t + SCR_GLITCH_GAP[0] + scrRand() * (SCR_GLITCH_GAP[1] - SCR_GLITCH_GAP[0]);
    const start = Math.floor(scrRand() * n);
    for (let k = 0; k < n; k++) {
      const inst = scrInstances[(start + k) % n];
      if (t - inst.last < 0.5) { inst.glitchAt = t; break; }
    }

    const inst = scrInstances[(scrFrame + k) % n];

    scrDraw(inst, t); budget--;

// Returns { name, color, aspect, screenTex, marqueeTex, sideTex, panelTex, tag, index }.
//   screenTex 256x192 animated (throttled, culled); marqueeTex 512x128, sideTex 256x512, panelTex 512x192 static
//   (shared between cabinets showing the same game). worldPos {x, z, rot} is optional: without it the position is
//   looked up in registry.cabinets, and if that fails the screen counts as always visible.
function makeCabinetArt(index, worldPos) {
  const def = GAMES[((index % GAME_COUNT) + GAME_COUNT) % GAME_COUNT], art = scrStaticArt(def);
  const raw = makeCanvas(SCR_W, SCR_H), screen = makeCanvas(SCR_W, SCR_H), gl1 = makeCanvas(128, 96), gl2 = makeCanvas(64, 48);
  raw.ctx.imageSmoothingEnabled = false; screen.ctx.imageSmoothingEnabled = false;

    rawCanvas: raw.canvas, rawCtx: raw.ctx, g: screen.ctx, glowCanvas1: gl1.canvas, glow1: gl1.ctx, glowCanvas2: gl2.canvas, glow2: gl2.ctx,
  };

}

// ═══════════════ PROPS & SIGNAGE: prize counter, vending/change machines, neon signs, posters, scoreboard ═══════════════
// Owner: props agent (the games agent owns 55-games.js). Entry point: buildProps(). Runs after buildRoom() and buildCabinets().
// Register every prop that should make noise or light in `registry.props`, and add colliders for solid ones.
//
// How this part keeps the draw-call count low: every static box/cylinder/quad is collected in a PropBatch (one per
// material) and merged into ONE mesh at the end; posters, signs and stickers share texture atlases; the prizes are
// InstancedMeshes. Nothing here adds real lights: glow is emissive vertex colour + additive halo quads.
//

// (y 1.14-2.4)  >  staff aisle  >  counter top (y 1.05)  >  glass display case  >  customers.


// ── Constants ──

const PROP_COUNTER = { zFront: -5.5, zBack: -6.15 };      // glass front / back face of the prize counter
const PROP_PLUSH = [0xff5fa8, 0x4fd2ff, 0xffd93b, 0x7be36a, 0xb489ff, 0xff8a3d, 0xf2f2ff, 0xff4d4d];
const PROP_FRAMES = [0x0d0d12, 0x3a2716, 0xa4a9bc, 0x14141c];   // poster frame colours (black, wood, silver, charcoal)

const PROP_SCORE_COLORS = ['#3dff88', '#3ad7ff', '#ff5fd0', '#ffe14a', '#ff8a3d', '#b489ff'];

  const m = (v) => Math.round(v + (255 - v) * k);

// ═══════════════ Batching helpers ═══════════════
const _pm = new THREE.Matrix4(), _pq = new THREE.Quaternion(), _pe = new THREE.Euler(),
      _pv = new THREE.Vector3(), _ps = new THREE.Vector3(1, 1, 1), _pc = new THREE.Color();

// Collects geometry, bakes position/rotation/colour into it, and merges everything into one mesh.
class PropBatch {
  constructor(material, { colored = true, atlas = null } = {}) {

  }

  add(geo, x, y, z, color = 0xffffff, k = 1, rx = 0, ry = 0, rz = 0) {
    _pe.set(rx, ry, rz, 'YXZ');

  cyl(rTop, rBot, h, x, y, z, color, k, seg = 18, rx, ry, rz) { return this.add(new THREE.CylinderGeometry(rTop, rBot, h, seg), x, y, z, color, k, rx, ry, rz); }
  sphere(r, x, y, z, color, k, rx, ry, rz) { return this.add(new THREE.SphereGeometry(r, 14, 10), x, y, z, color, k, rx, ry, rz); }
  plane(w, h, x, y, z, color, k, rx, ry, rz) { return this.add(new THREE.PlaneGeometry(w, h), x, y, z, color, k, rx, ry, rz); }

  build(renderOrder = 0) {

// Position of a wall-mounted item: `along` is x (north/south walls) or z (west/east walls), `off` the gap to the wall.
function propWallSpot(wall, along, off) {
  if (wall === 'N') return { x: along, z: -ROOM.d / 2 + off, ry: 0 };
  if (wall === 'S') return { x: along, z: ROOM.d / 2 - off, ry: Math.PI };
  if (wall === 'W') return { x: -ROOM.w / 2 + off, z: along, ry: Math.PI / 2 };
  return { x: ROOM.w / 2 - off, z: along, ry: -Math.PI / 2 };
}

// Soft radial and rectangular halo textures used by the additive glow quads.
function propGlowTextures() {
  const radial = propPainted(128, 128, (c) => {
    const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,0.55)'); g.addColorStop(0.55, 'rgba(255,255,255,0.16)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, 128, 128);
  });
  const box = propPainted(256, 128, (c) => {   // rectangle with feathered edges (fades to 0 at the border)
    const img = c.createImageData(256, 128), smooth = (t) => t * t * (3 - 2 * t);
    for (let y = 0; y < 128; y++) for (let x = 0; x < 256; x++) {
      const i = (y * 256 + x) * 4, a = smooth(Math.min(1, Math.min(x, 255 - x) / 70)) * smooth(Math.min(1, Math.min(y, 127 - y) / 40));
      img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = Math.round(a * 255);
    }
    c.putImageData(img, 0, 0);
  });
  return { radial, box };
}

function propStockRow(kit, x0, x1, y, z0, z1, s, r) {
  let x = x0 + 0.14 * s;
  while (x < x1 - 0.14 * s) {
    const pick = r(), z = z0 + r() * (z1 - z0);
    const width = pick < 0.44 ? 0.27 * s : pick < 0.64 ? 0.2 * s : pick < 0.8 ? 0.13 * s : pick < 0.92 ? 0.12 * s : 0.14 * s;
    const cx = x + width / 2;

    else if (pick < 0.8) propBalls(kit, cx, y, z, s, r);
    else if (pick < 0.92) propRocket(kit, cx, y, z, s);
    else propTrophy(kit, cx, y, z, s);
    x += width + 0.03 + r() * 0.05;

}

  };

function propScoreboard(kit) {
  const { solid, haloBox } = kit, W = 96, H = 32, sp = propWallSpot('W', 0, 0.06);
  const { canvas, ctx } = makeCanvas(W, H);
  const tex = canvasTexture(canvas, { anisotropy: 1 });
  tex.magFilter = tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false;
  const mat = new THREE.ShaderMaterial({
    uniforms: { map: { value: tex }, grid: { value: new THREE.Vector2(W, H) }, gain: { value: 1.6 } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform sampler2D map; uniform vec2 grid; uniform float gain; varying vec2 vUv;
      void main() {
        vec2 c = vUv * grid;
        vec3 col = texture2D(map, (floor(c) + 0.5) / grid).rgb;
        float m = smoothstep(0.5, 0.3, length(fract(c) - 0.5));
        m = mix(m, 0.6, smoothstep(0.35, 0.9, fwidth(c.x)));      // fade to an average when the dots get sub-pixel
        gl_FragColor = vec4(col * m * gain + vec3(0.01, 0.004, 0.003), 1.0);
      }`,
  });
  const y = 2.68, x = sp.x + 0.03;
  solid.box(0.1, 0.58, 1.6, -9.95, y, 0, 0x0c0a12); solid.box(0.12, 0.03, 1.66, -9.95, y + 0.3, 0, 0x5a5f78, 0.8); solid.box(0.12, 0.03, 1.66, -9.95, y - 0.3, 0, 0x5a5f78, 0.8);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.47), mat);
  mesh.position.set(-9.895, y, 0); mesh.rotation.y = Math.PI / 2; scene.add(mesh);
  haloBox.plane(2.6, 1.1, x - 0.02, y, 0, PROP_WARM, 0.2, 0, Math.PI / 2);
  // content: title, scrolling ticker of scores, blinking prompt; redrawn ~12x/s only while the player is near and facing it
  const tokenW = 12 * 6, loop = PROP_SCORES.length * (tokenW + 24);
  let last = -1;
  const draw = (t) => {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    propDotText(ctx, 'HIGH SCORES', 15, 2, 1, '#ffc93a');
    ctx.fillStyle = '#5a3a08'; ctx.fillRect(4, 10, 88, 1); ctx.fillRect(4, 22, 88, 1);
    const scroll = (t * 16) % loop;
    for (let i = 0; i < PROP_SCORES.length; i++) {
      for (let wrap = 0; wrap <= loop; wrap += loop) {
        const px = Math.round(i * (tokenW + 24) - scroll + wrap);
        if (px > -tokenW && px < W) propDotText(ctx, PROP_SCORES[i], px, 13, 1, PROP_SCORE_COLORS[i]);
      }
    }
    if (Math.floor(t * 1.5) % 2 === 0) propDotText(ctx, 'INSERT COIN', 15, 24, 1, '#ff3a4a');
    tex.needsUpdate = true;
  };
  draw(0);
  kit.tickers.push((t) => {
    if (t - last < 0.083) return;

    if (dx * dx + dz * dz > 196 || -Math.sin(player.yaw) * dx - Math.cos(player.yaw) * dz < 0) return;   // far away or behind the camera

// ═══════════════ GAME PROPS: pinball machines, claw machines, air hockey tables, stools & bench ═══════════════
// Owner: games agent. Entry point: buildGameProps(). Runs after buildProps(). No real lights are added.
//
// How this part is organised
//   * Static geometry is baked into world space and merged into a few meshes per zone. Six shared materials
//     (solid / chrome / glow / glass / glare / floor-glow) read per-vertex colours, so any colour costs nothing.
//   * Per-machine artwork (playfields, backglasses, side decals, marquees, air-hockey surfaces) is painted once on canvases.
//   * Motion is transform-only and event-driven: instanced claws on long timers, air-hockey pucks that rally every few
//     seconds, and every lamp chase (backglass borders, playfield inserts, marquee bulbs) lives in ONE InstancedMesh
//     whose instance colours change at 8 Hz. Nothing here re-uploads a canvas after the build.
//   * To add another machine: add an entry to GP_PINBALLS / GP_CLAWS / GP_TABLES (or copy a gpBuild... function).
