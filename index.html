<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: a plain stylesheet link would keep the whole page blank (and delay every script) while Google Fonts is slow or unreachable. -->
<link id="fontsheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.dataset.state='ok';this.media='all'" onerror="this.dataset.state='err'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05040a; font-family: system-ui, sans-serif; }
  canvas { display: block; }

  /* "Click to enter" overlay: shown whenever the mouse is not captured. */
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.5rem;
    background: rgba(5, 4, 10, 0.78); color: #dcd6f0;
    cursor: pointer; user-select: none; text-align: center; padding: 0 16px;
  }
  #prompt { font-size: 2.2rem; letter-spacing: 0.08em; color: #ff4fd8; text-shadow: 0 0 12px #ff4fd8, 0 0 32px #9b5cff; }
  #controls { border-spacing: 0.6rem 0.4rem; text-align: left; }
  #controls td:first-child { text-align: right; }
  kbd { padding: 0.15em 0.5em; border: 1px solid #00e5ff; border-radius: 4px; color: #00e5ff; font: inherit; font-size: 0.9rem; }
  body.locked #overlay { display: none; }

  /* Small dot crosshair, only shown while the mouse is captured. */
  #crosshair {
    display: none; position: fixed; left: 50%; top: 50%; width: 4px; height: 4px;
    margin: -2px 0 0 -2px; border-radius: 50%; background: #fff; opacity: 0.85;
    box-shadow: 0 0 2px #000; pointer-events: none;
  }
  body.locked #crosshair { display: block; }

  /* Brief message at the bottom of the screen (e.g. "Sound off"). */
  #toast {
    position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%);
    padding: 0.5em 1em; border-radius: 6px; background: rgba(5, 4, 10, 0.7); color: #dcd6f0;
    font-size: 0.9rem; pointer-events: none; opacity: 0; transition: opacity 0.25s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="overlay">
  <div id="prompt">Loading…</div>
  <table id="controls">
    <tr><td><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> / arrows</td><td>Walk</td></tr>
    <tr><td><kbd>Mouse</kbd></td><td>Look around</td></tr>
    <tr><td><kbd>Shift</kbd></td><td>Move faster</td></tr>
    <tr><td><kbd>M</kbd></td><td>Sound on / off</td></tr>
    <tr><td><kbd>Esc</kbd></td><td>Release the mouse</td></tr>
  </table>
</div>
<div id="crosshair"></div>
<div id="toast"></div>

<script>
  // Three.js comes from a CDN. Say so if the app never reaches "Click to enter": slow (8 s) or failed (error / 30 s).
  (() => {
    const p = document.getElementById('prompt');
    let failed = false;
    const say = (msg, hard) => {          // the app sets data-ready once it is running; a hard failure message is never replaced
      if (p.dataset.ready || failed) return;
      failed = !!hard; p.textContent = msg; p.style.fontSize = '1.2rem';
    };
    const fail = () => say('Could not start. Check your internet connection (Three.js loads from a CDN) and that WebGL is enabled.', true);
    setTimeout(() => say('Still loading… (Three.js comes from a CDN, so this needs an internet connection.)'), 8000);
    setTimeout(fail, 30000);
    addEventListener('error', (e) => { if (!(e.target && e.target.tagName === 'LINK')) fail(); }, true);   // uncaught exception or failed module load
  })();
</script>

<script type="importmap">
{ "imports": {

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { CopyShader } from 'three/addons/shaders/CopyShader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import * as roomGeo from 'three/addons/utils/BufferGeometryUtils.js';
import * as CabGeoUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry as CabRoundedBox } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as GpBGU from 'three/addons/utils/BufferGeometryUtils.js';

// ═══════════════ CORE: settings, renderer, scene, camera, shared helpers ═══════════════
// All parts share ONE module scope (they are concatenated by build.mjs).
// Names declared here are the shared API described in CONTRACT.md.

const ROOM = { w: 20, d: 14, h: 4 };      // metres: x, z, y. Centred on the origin, floor at y = 0.
const EYE_HEIGHT = 1.7;
const WALK_SPEED = 3;                     // m/s
const RUN_SPEED = 5.5;                    // m/s while holding Shift
const PLAYER_RADIUS = 0.3;                // for collisions
const LOOK_SENSITIVITY = 0.002;           // radians per pixel of mouse movement

const NEON = { pink: 0xff2bd6, cyan: 0x00e5ff, purple: 0x9b5cff, orange: 0xff8a1f,
               yellow: 0xffe600, green: 0x39ff88, red: 0xff2a3a, blue: 0x2f6bff };

const URL_PARAMS = new URLSearchParams(window.location.search);

// Troubleshooting switches for graphics drivers that draw something wrongly (e.g. index.html?nomsaa). ?safe turns all of them on.
//   ?nomsaa  no multisampled render targets     ?ldr  8 bit instead of half-float render targets (no glow above white)
//   ?nobloom no bloom pass                       ?pr1  render at 1 pixel per CSS pixel, whatever the display scaling
const urlFlag = (name) => URL_PARAMS.has(name) || URL_PARAMS.has('safe');

// Runtime quality knobs. The render part may lower these automatically if the frame rate is poor.
const QUALITY = {
  level: 2,                                               // 2 = high, 1 = medium, 0 = low
  pixelRatio: urlFlag('pr1') ? 1 : Math.min(window.devicePixelRatio || 1, 2),
  bloom: !urlFlag('nobloom'),
  adapt: !URL_PARAMS.has('noadapt'),                      // ?noadapt disables auto-downgrade (used by tests)
};

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(QUALITY.pixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040a);
scene.fog = new THREE.FogExp2(0x07050f, 0.03);

const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 60);
camera.rotation.order = 'YXZ';            // yaw first, then pitch

// Player state: floor position plus look direction. Start by the entrance, facing north (-z).
const player = { x: 0, z: 5, yaw: 0, pitch: 0 };

// Axis-aligned boxes on the floor plane that the player can't walk into.
const colliders = [];                     // each: { minX, maxX, minZ, maxZ }
function addCollider(minX, maxX, minZ, maxZ) { colliders.push({ minX, maxX, minZ, maxZ }); }

// Per-frame hooks: fn(timeSeconds, dtSeconds). Called once per frame before rendering.
const updaters = [];
function onUpdate(fn) { updaters.push(fn); }

// Things other parts may want to know about (audio, lighting, ...).
const registry = {
  cabinets: [],   // { x, z, rot, color, name, art }   video cabinets (cabinets part)
  props: [],      // { kind, x, z, y?, color? }        other objects with a sound or light (props part)
  lights: [],     // every light the lighting part creates
};

// ── Helpers ──
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { canvas: c, ctx: c.getContext('2d') };
}

// Wraps a canvas as a texture. sRGB by default (colour art); pass srgb:false for data maps.
function canvasTexture(cnv, { srgb = true, repeat = null, anisotropy = 4 } = {}) {
  const tex = new THREE.CanvasTexture(cnv);
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(repeat[0], repeat[1]); }
  tex.anisotropy = anisotropy;
  return tex;
}

// Small seeded random generator so procedural art is the same on every load: const r = rng(42); r() -> [0,1)
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Neon-arcade font stack for canvas text. Redraw signs after `fontsReady` resolves if you use it.
const ARCADE_FONT = '"Press Start 2P", "Courier New", monospace';
// The Google Fonts stylesheet is non-blocking (see template), so wait for it (or its failure), then for the font file.
// Never waits longer than 5 s: after that canvases simply keep the fallback font.
const fontsReady = new Promise((resolve) => {
  const link = document.getElementById('fontsheet');
  const timer = setTimeout(resolve, 5000);
  const finish = () => { clearTimeout(timer); resolve(); };
  const loadFont = () => {
    if (!(document.fonts && document.fonts.load)) return finish();
    document.fonts.load('16px "Press Start 2P"').catch(() => {}).then(finish);
  };
  const state = link && link.dataset.state;
  if (!link || state === 'ok') loadFont();
  else if (state === 'err') finish();
  else { link.addEventListener('load', loadFont); link.addEventListener('error', finish); }
});

// Canvas roundRect() is missing in Safari < 16 and Firefox < 112; without it those browsers would throw while building the room.
function polyfillRoundRect(proto) {
  if (!proto || proto.roundRect) return;
  proto.roundRect = function (x, y, w, h, r = 0) {
    const rad = Math.max(0, Math.min(Array.isArray(r) ? +r[0] || 0 : +r || 0, Math.abs(w) / 2, Math.abs(h) / 2));
    this.moveTo(x + rad, y);
    this.arcTo(x + w, y, x + w, y + h, rad); this.arcTo(x + w, y + h, x, y + h, rad);
    this.arcTo(x, y + h, x, y, rad); this.arcTo(x, y, x + w, y, rad);
    this.closePath();
  };
}
polyfillRoundRect(window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype);
polyfillRoundRect(window.Path2D && Path2D.prototype);

// ═══════════════ RENDER PIPELINE: composer, bloom, colour grade, resize, adaptive quality ═══════════════
// Owner: look agent. Entry points used by other parts: setupRenderPipeline(), resizeRender(w,h), renderFrame(dt).
//
// Pass chain (half-float HDR targets):
//   SceneMsaaPass -> UnrealBloomPass -> OutputPass (tone mapping + sRGB) -> grade ShaderPass (screen)
// The scene is drawn into its own multisampled target and copied into the composer's plain (single-sample) buffer, and the bloom
// glow is blended onto that plain buffer. Blending onto a multisampled half-float target left a big black rectangle on some graphics
// drivers (any one of: no MSAA, 8 bit target, no bloom made it go away).
// The grade runs AFTER tone mapping, in display space, so its contrast / split-tone curves behave predictably.



// ── Tuning constants ──────────────────────────────────────────────────────────────────────────
const RENDER_TONE_MAPPING = THREE.ACESFilmicToneMapping;   // filmic roll-off: deep blacks, neon cores go hot-white (art direction assumes ACES)
const RENDER_EXPOSURE = 1.12;

const BLOOM_STRENGTH = 0.26;      // how much glow is added back
const BLOOM_RADIUS = 0.4;         // how far the glow spreads (0..1)
const BLOOM_THRESHOLD = 1.1;     // HDR luminance where glow starts: lit walls stay clean, neon blooms

const GRADE = {
  vignette: 0.42,                 // corner darkening, 0 = off
  chroma: 0.0008,                 // radial RGB split at the frame edge (fraction of the screen width)
  grain: 0.024,                   // film grain amplitude (also acts as dither against banding)
  contrast: 0.16,                 // S-curve strength around mid grey
  splitTone: 0.75,                // 0 = neutral, 1 = full teal shadows / magenta highlights
  saturation: 1.12,
  blackLift: [0.004, 0.010, 0.016],   // adds a hint of teal to pure black so the room is never dead flat
};

// Adaptive quality. Only active when QUALITY.adapt is true (the test harness passes ?noadapt).
// Each step is applied once and never reverted, so the picture cannot flap between settings.
// The decision uses the MEDIAN of the last frames, so isolated hitches (a shader compile or texture upload when a new
// object turns into view, a quick alt-tab) never count; only a typical frame that stays slow does.
const ADAPT = {
  minFps: 45,                     // median frame slower than this for slowSeconds -> step down one level
  slowSeconds: 1.5,
  windowFrames: 30,               // size of the rolling window the median is taken over
  warmupSeconds: 1.5,             // ignored after start / a quality step (shader compiles, texture uploads)
  resizeSettleSeconds: 0.6,       // ignored after a window resize (framebuffer re-allocation hitch)
  pauseSeconds: 2,                // a longer gap is a tab switch or pointer-lock pause, not slowness
  maxCountedSeconds: 0.25,        // longest single frame that adds to the slow time
};

// What each quality level means (level 2 is the starting point).
const QUALITY_LEVELS = [
  { maxPixelRatio: 1.0,  samples: 0, bloomScale: 0.5, grain: false, chroma: false },   // 0: low
  { maxPixelRatio: 1.25, samples: 2, bloomScale: 1.0, grain: false, chroma: true  },   // 1: medium
  { maxPixelRatio: 2.0,  samples: 4, bloomScale: 1.0, grain: true,  chroma: true  },   // 2: high
];

// ── Colour grade shader ───────────────────────────────────────────────────────────────────────
const GradeShader = {
  name: 'ArcadeGrade',
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uAspect: { value: 1.78 },
    uVignette: { value: GRADE.vignette },
    uChroma: { value: GRADE.chroma },
    uGrain: { value: GRADE.grain },
    uContrast: { value: GRADE.contrast },
    uSplit: { value: GRADE.splitTone },
    uSaturation: { value: GRADE.saturation },
    uLift: { value: new THREE.Vector3(...GRADE.blackLift) },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float uTime, uAspect, uVignette, uChroma, uGrain, uContrast, uSplit, uSaturation;
    uniform vec3 uLift;
    varying vec2 vUv;

    float hash(vec2 p) {                     // cheap 2D hash, good enough for grain
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main() {
      vec2 c = vUv - 0.5;
      float r2 = dot(c * vec2(uAspect, 1.0), c * vec2(uAspect, 1.0));

      // Chromatic aberration: red and blue slide apart radially, growing towards the edges.
      vec3 col;
      if (uChroma > 0.0) {
        vec2 off = c * (uChroma * r2 * 4.0);
        col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
      } else {
        col = texture2D(tDiffuse, vUv).rgb;
      }

      float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));

      // Contrast: gentle S-curve that deepens shadows and lifts highlights without clipping.
      col = mix(col, col * col * (3.0 - 2.0 * col), uContrast);

      // Split tone: teal in the shadows, magenta in the highlights.
      vec3 shadowTint = vec3(0.90, 1.00, 1.07);
      vec3 highTint   = vec3(1.08, 0.96, 1.05);
      col *= mix(vec3(1.0), mix(shadowTint, highTint, smoothstep(0.08, 0.75, luma)), uSplit);
      col += uLift;

      // Saturation boost keeps the neon punchy after the tint.
      float l2 = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(l2), col, uSaturation);

      // Vignette.
      col *= 1.0 - uVignette * smoothstep(0.10, 0.62, r2 * 1.2);

      // Grain (strongest in the mid-tones) plus +-0.5/255 dither to hide banding in the dark gradients.
      float n = hash(gl_FragCoord.xy + fract(uTime * 7.31) * 173.0) - 0.5;
      col += n * uGrain * (0.35 + smoothstep(0.0, 0.5, l2));
      col += (hash(gl_FragCoord.xy * 1.37 + 11.0) - 0.5) / 255.0;

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`,
};

// ── Scene pass ────────────────────────────────────────────────────────────────────────────────
// Draws the scene into its own multisampled target (three.js resolves it into the target's texture), then copies that resolved
// image into the composer's read buffer, like RenderPass would have drawn it there. Everything after this pass only ever
// touches single-sample targets.
class SceneMsaaPass extends Pass {
  constructor(scene, camera, type, samples) {
    super();
    this.needsSwap = false;                                  // the result stays in readBuffer, as with RenderPass
    this.renderPass = new RenderPass(scene, camera);
    this.target = new THREE.WebGLRenderTarget(1, 1, { type, samples });
    this.copyQuad = new FullScreenQuad(new THREE.ShaderMaterial({
      uniforms: THREE.UniformsUtils.clone(CopyShader.uniforms),
      vertexShader: CopyShader.vertexShader, fragmentShader: CopyShader.fragmentShader,
      blending: THREE.NoBlending, depthTest: false, depthWrite: false,
    }));
  }
  setSize(w, h) { this.target.setSize(Math.max(1, Math.floor(w)), Math.max(1, Math.floor(h))); }
  render(renderer, writeBuffer, readBuffer) {
    this.renderPass.render(renderer, writeBuffer, this.target);
    this.copyQuad._mesh.material.uniforms.tDiffuse.value = this.target.texture;
    renderer.setRenderTarget(readBuffer);
    this.copyQuad.render(renderer);
  }
  dispose() {
    this.target.dispose();
    this.copyQuad._mesh.material.dispose();
    this.copyQuad.dispose();
  }
}

// ── State ─────────────────────────────────────────────────────────────────────────────────────
let composer, scenePass, bloomPass, gradePass;
let renderWidth = window.innerWidth, renderHeight = window.innerHeight;   // CSS pixels of the last resize
let gradeTime = 0;
let contextLost = false;

// Adaptive-quality bookkeeping (only touched when QUALITY.adapt is true).
let adaptLastMs = 0, adaptCount = 0, adaptSlowFor = 0, adaptIgnoreUntil = 0;
const adaptRing = new Float32Array(ADAPT.windowFrames), adaptSorted = new Float32Array(ADAPT.windowFrames);

const RENDER_BASE_PIXEL_RATIO = QUALITY.pixelRatio;    // the device's own ratio, our upper bound

function setupRenderPipeline() {
  renderer.toneMapping = RENDER_TONE_MAPPING;
  renderer.toneMappingExposure = RENDER_EXPOSURE;

  // Half-float targets: HDR so bright neon can bloom. GPUs that cannot render to float textures (no EXT_color_buffer_float /
  // _half_float) fall back to 8 bit: no glow above white, but no black screen. The composer's own targets are single-sample;
  // the anti-aliasing (MSAA) lives in the scene pass's target, whose sample count applyQualityLevel sets.
  const hdr = !urlFlag('ldr') && (renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float'));
  const type = hdr ? THREE.HalfFloatType : THREE.UnsignedByteType;
  composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type, depthBuffer: false }));
  scenePass = new SceneMsaaPass(scene, camera, type, 0);
  composer.addPass(scenePass);

  bloomPass = new UnrealBloomPass(new THREE.Vector2(1, 1), BLOOM_STRENGTH, BLOOM_RADIUS, BLOOM_THRESHOLD);
  composer.addPass(bloomPass);

  composer.addPass(new OutputPass());                    // tone mapping + sRGB encoding

  gradePass = new ShaderPass(GradeShader);               // last pass: renders to the canvas
  composer.addPass(gradePass);

  // A lost GL context must not crash the loop: pause rendering, resume when the browser restores it.
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); contextLost = true; });
  canvas.addEventListener('webglcontextrestored', () => {
    contextLost = false;
    resizeRender(renderWidth, renderHeight);
    if (QUALITY.adapt) adaptRestart(ADAPT.warmupSeconds);    // everything is re-uploaded: not a sign of a slow GPU
  });

  applyQualityLevel(QUALITY.level);
}

// Applies QUALITY_LEVELS[level]: pixel ratio cap, MSAA samples, bloom resolution, grain, chromatic aberration.
function applyQualityLevel(level) {
  const q = QUALITY_LEVELS[Math.max(0, Math.min(QUALITY_LEVELS.length - 1, level))];
  QUALITY.level = QUALITY_LEVELS.indexOf(q);
  QUALITY.pixelRatio = Math.min(RENDER_BASE_PIXEL_RATIO, q.maxPixelRatio);
  bloomPass.enabled = QUALITY.bloom;
  gradePass.uniforms.uGrain.value = q.grain ? GRADE.grain : 0;
  gradePass.uniforms.uChroma.value = q.chroma ? GRADE.chroma : 0;

  // Changing the MSAA sample count means re-creating the framebuffers: dispose, three.js rebuilds them lazily.
  const samples = urlFlag('nomsaa') ? 0 : q.samples;
  if (scenePass.target.samples !== samples) { scenePass.target.samples = samples; scenePass.target.dispose(); }
  resizeRender(renderWidth, renderHeight);
}

function resizeRender(w, h) {
  if (!(w > 0 && h > 0)) return;                          // minimised window reports 0 x 0: keep the last size
  renderWidth = w; renderHeight = h;
  const pr = QUALITY.pixelRatio;
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  composer.setPixelRatio(pr);
  composer.setSize(w, h);
  // Low quality: run the bloom blur chain at a fraction of the resolution (it is soft anyway).
  const scale = QUALITY_LEVELS[QUALITY.level].bloomScale;
  if (scale < 1) bloomPass.setSize(Math.max(2, Math.round(w * pr * scale)), Math.max(2, Math.round(h * pr * scale)));
  gradePass.uniforms.uAspect.value = w / Math.max(1, h);
  if (QUALITY.adapt) adaptRestart(ADAPT.resizeSettleSeconds);
}

// Stops measuring for `seconds` and forgets what was measured so far.
function adaptRestart(seconds) {
  adaptIgnoreUntil = performance.now() + seconds * 1000;
  adaptCount = 0; adaptSlowFor = 0;
}

// Watches the median frame time and steps quality down when it stays under ADAPT.minFps.
function adaptQuality() {
  const now = performance.now();
  const frameSec = (now - adaptLastMs) / 1000;
  const first = adaptLastMs === 0;
  adaptLastMs = now;
  if (first) { adaptRestart(ADAPT.warmupSeconds); return; }
  if (frameSec > ADAPT.pauseSeconds) { adaptRestart(ADAPT.resizeSettleSeconds); return; }
  if (now < adaptIgnoreUntil) return;

  adaptRing[adaptCount++ % ADAPT.windowFrames] = frameSec;
  if (adaptCount < ADAPT.windowFrames) return;             // wait until the window is full
  adaptSorted.set(adaptRing); adaptSorted.sort();
  if (adaptSorted[ADAPT.windowFrames >> 1] > 1 / ADAPT.minFps) adaptSlowFor += Math.min(frameSec, ADAPT.maxCountedSeconds);
  else adaptSlowFor = 0;

  if (adaptSlowFor >= ADAPT.slowSeconds && QUALITY.level > 0) {
    applyQualityLevel(QUALITY.level - 1);
    adaptRestart(ADAPT.warmupSeconds);
  }
}

function renderFrame(dt) {
  if (contextLost) return;
  if (QUALITY.adapt) adaptQuality();
  gradeTime += dt;
  gradePass.uniforms.uTime.value = gradeTime;
  composer.render(dt);
}

// Compiles every material's shader up front (off the main thread where the browser supports KHR_parallel_shader_compile), so
// the first frame does not stall for seconds and turning around later never hits a compile. Never rejects.
function precompileScene() {
  const finish = (p) => Promise.race([p, new Promise((resolve) => setTimeout(resolve, 15000))]).catch(() => {});
  try {
    renderer.setRenderTarget(scenePass.target);            // the scene is drawn into the HDR target: its programs differ from canvas ones
    let p = Promise.resolve();
    if (renderer.extensions.has('KHR_parallel_shader_compile')) p = renderer.compileAsync(scene, camera);
    else renderer.compile(scene, camera);                  // no parallel compile: still do it all now rather than in the middle of play
    renderer.setRenderTarget(null);
    return finish(p);
  } catch (e) {
    renderer.setRenderTarget(null);
    return Promise.resolve();
  }
}

// ═══════════════ LIGHTING & ATMOSPHERE: environment map, lights, ceiling cans, beams, haze, flicker ═══════════════
// Owner: look agent. Entry point: buildLighting(). Runs BEFORE the room/cabinets are built.
//
// Light budget: 10 real lights in total for the whole scene (1 hemisphere + 6 point + 3 spot). No other part adds any.
// Public helper for other parts:  neonGlowSprite(color, size, intensity)  (see the bottom of this file).


// ── Tuning constants ──────────────────────────────────────────────────────────────────────────
const FOG_COLOR = 0x09061a;
const FOG_DENSITY = 0.032;                    // exponential: ~85 % clear at 12 m, far wall stays visible
const ENV_INTENSITY = 0.34;                   // strength of the neon-studio reflections on every standard material
const HEMI = { sky: 0x3f4f92, ground: 0x160f26, intensity: 0.32 };  // dim cool ambient fill

// Point lights (candela, decay 2). Placed next to the neon strips / over the counter so spill reads on carpet and cabinet tops.
const POINT_LIGHTS = [
  { name: 'counter',  color: 0xffa64d, intensity: 26, x:  0.0, y: 3.0, z: -5.4, range: 11 },   // warm amber over the prize counter
  { name: 'island',   color: NEON.purple, intensity: 22, x: 0.0, y: 3.0, z:  0.0, range: 12 },
  { name: 'west',     color: NEON.pink,   intensity: 28, x: -6.6, y: 3.0, z: -0.7, range: 13 },
  { name: 'east',     color: NEON.cyan,   intensity: 28, x:  6.6, y: 3.0, z: -0.7, range: 13 },
  { name: 'southwest', color: 0xc23cff,   intensity: 22, x: -5.6, y: 3.0, z:  5.0, range: 12 },
  { name: 'southeast', color: 0x18b8ff,   intensity: 22, x:  5.6, y: 3.0, z:  5.0, range: 12 },
];

// Ceiling can fixtures with a visible additive beam. `real: true` also gets a SpotLight (3 in total incl. the door).
// (x, z) = fixture position on the ceiling, (tx, tz) = where the beam lands on the floor.
const CEILING_CANS = [
  { x: -4.2, z:  2.8, tx: -3.4, tz:  1.6, color: NEON.pink,   real: true,  intensity: 95 },
  { x:  4.2, z:  2.8, tx:  3.4, tz:  1.6, color: NEON.cyan,   real: true,  intensity: 95 },
  { x: -3.6, z: -2.8, tx: -2.9, tz: -1.9, color: NEON.purple, real: false },
  { x:  3.6, z: -2.8, tx:  2.9, tz: -1.9, color: 0x4d7dff,    real: false },
  { x:  0.0, z: -3.9, tx:  0.0, tz: -6.0, color: 0xffb060,    real: false, ty: 1.06, pool: false },   // warm spot on the prize counter top
  { x: -7.4, z:  3.6, tx: -6.5, tz:  2.2, color: NEON.cyan,   real: false },
  { x:  7.4, z:  3.6, tx:  6.5, tz:  2.2, color: NEON.pink,   real: false },
  { x:  0.0, z:  3.4, tx:  0.0, tz:  2.3, color: 0x8f6bff,    real: false },
];
const CAN_HEIGHT = 3.9;                       // fixture lens height
const BEAM_HALF_ANGLE = 0.15;                 // radians (cone half-angle of the visible beam)
const BEAM_STRENGTH = 0.3;                    // additive brightness of the visible cones
const POOL_STRENGTH = 0.30;                   // brightness of the soft light pool painted where a beam hits the floor
const SPOT_ANGLE = 0.52, SPOT_PENUMBRA = 0.85;

// Street light bleeding in through the glass doors in the south wall (spot placed outside, pointing in).
const DOOR_SPOT = { color: 0x5b8cff, intensity: 70, x: 0, y: 2.6, z: 7.6, tx: 0, ty: 0, tz: 3.6, angle: 0.62 };

// Haze / dust motes.
const MOTE_COUNT = 900;
const MOTE_SIZE = 0.04;                       // metres
const MOTE_BASE_ALPHA = 0.22;
const MOTE_BEAM_BOOST = 1.6;                  // motes inside a beam glint brighter

// Occasional neon flicker: a light buzzes for a moment every FLICKER_MIN..MAX seconds. Nothing runs in between.
const FLICKER_MIN = 9, FLICKER_MAX = 24;      // seconds between events
const FLICKER_LENGTH = [0.35, 0.9];           // seconds a flicker lasts
const FLICKER_LIGHTS = ['west', 'east', 'southwest'];

// ── Shared state ──────────────────────────────────────────────────────────────────────────────
const _lightByName = {};                      // name -> light (for the flicker and for other parts via registry.lights)

// ── Light creation ────────────────────────────────────────────────────────────────────────────
function lightRegister(light, name) {
  scene.add(light);
  registry.lights.push(light);
  if (name) _lightByName[name] = light;
  return light;
}

function lightAddPoint({ name, color, intensity, x, y, z, range }) {
  const light = new THREE.PointLight(color, intensity, range, 2);   // colour, candela, range, decay
  light.position.set(x, y, z);
  light.userData.baseIntensity = intensity;
  return lightRegister(light, name);
}

function lightAddSpot(color, intensity, [x, y, z], [tx, ty, tz], angle, name) {
  const light = new THREE.SpotLight(color, intensity, 16, angle, SPOT_PENUMBRA, 2);
  light.position.set(x, y, z);
  light.target.position.set(tx, ty, tz);
  scene.add(light.target);
  light.userData.baseIntensity = intensity;
  return lightRegister(light, name);
}

// ── Procedural "neon studio" environment (reflections on glossy plastic, glass and metal) ─────
// A tiny dark box with emissive strips and panels; PMREM turns it into a prefiltered reflection map.
function buildEnvironment() {
  const env = new THREE.Scene();
  const shell = new THREE.Mesh(
    new THREE.BoxGeometry(24, 8, 18),
    new THREE.MeshBasicMaterial({ color: 0x030208, side: THREE.BackSide }));
  env.add(shell);

  const glowMats = {};
  const glow = (color, boost) => {
    const key = color + ':' + boost;
    return glowMats[key] || (glowMats[key] = new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(boost) }));
  };
  const panel = (color, boost, [sx, sy, sz], [x, y, z]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), glow(color, boost));
    m.position.set(x, y, z);
    env.add(m);
  };

  // Ceiling strips (long, so they read as neon tubes on curved chrome).
  panel(NEON.cyan,   7, [14, 0.25, 0.25], [0, 3.9, -3.2]);
  panel(NEON.pink,   7, [14, 0.25, 0.25], [0, 3.9,  3.2]);
  panel(NEON.purple, 6, [0.25, 0.25, 12], [-7, 3.9, 0]);
  panel(NEON.purple, 6, [0.25, 0.25, 12], [ 7, 3.9, 0]);
  // Wall strips at head height.
  panel(NEON.pink, 5, [0.2, 0.2, 14], [-11.8, 1.6, 0]);
  panel(NEON.cyan, 5, [0.2, 0.2, 14], [ 11.8, 1.6, 0]);
  // Big warm panel (prize counter side) and a cold "street" panel (glass doors side).
  panel(0xffa050, 3.2, [7, 1.6, 0.2], [0, 1.4, -8.8]);
  panel(0x5b8cff, 3.0, [4, 2.6, 0.2], [0, 1.1,  8.8]);
  // A few small hard highlights, like the ceiling cans, so glass gets crisp reflections.
  for (const [x, z, c] of [[-4, 2, NEON.pink], [4, 2, NEON.cyan], [-4, -3, NEON.purple], [4, -3, NEON.blue], [0, 0, NEON.pink]]) {
    panel(c, 9, [0.5, 0.05, 0.5], [x, 3.98, z]);
  }
  env.position.y = -1.7;                       // put the "camera" (the origin) at eye height

  const pmrem = new THREE.PMREMGenerator(renderer);
  const target = pmrem.fromScene(env, 0.03);
  scene.environment = target.texture;
  scene.environmentIntensity = ENV_INTENSITY;
  pmrem.dispose();
  env.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); } });
  for (const m of Object.values(glowMats)) m.dispose();
  shell.material.dispose();
}

// ── Ceiling cans, beams, floor pools ──────────────────────────────────────────────────────────
const _canUp = new THREE.Vector3(0, -1, 0);   // local axis every fixture/beam points along

// Fixture geometry in local space: lens at the origin, body extending up (+y); aimed by the matrix later.
function lightCanGeometries(matrix, color) {
  const body = new THREE.CylinderGeometry(0.1, 0.14, 0.36, 14);
  body.translate(0, 0.18 + 0.01, 0);
  const rim = new THREE.CylinderGeometry(0.155, 0.155, 0.03, 14);
  rim.translate(0, 0.015, 0);
  const lens = new THREE.CircleGeometry(0.125, 14);
  lens.rotateX(Math.PI / 2);                   // faces -y (down the beam)
  lens.translate(0, -0.005, 0);

  const c = new THREE.Color(color).multiplyScalar(3.2);
  const colors = [];
  for (let i = 0; i < lens.attributes.position.count; i++) colors.push(c.r, c.g, c.b);
  lens.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  return { metal: [body, rim].map((g) => g.applyMatrix4(matrix)), lens: lens.applyMatrix4(matrix) };
}

// Additive beam material: bright core, soft edges (fresnel), fading away from the lens and near the camera.
function lightBeamMaterial(color, strength) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color).multiplyScalar(strength) } },
    vertexShader: /* glsl */`
      varying float vT; varying vec3 vN; varying vec3 vV;
      void main() {
        vT = -position.y;                              // 0 at the lens, 1 at the far end of the cone
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vN = normalize(normalMatrix * normal);
        vV = -mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uColor;
      varying float vT; varying vec3 vN; varying vec3 vV;
      void main() {
        float facing = abs(dot(normalize(vN), normalize(vV)));
        float core = pow(facing, 1.7);
        float along = pow(1.0 - vT, 1.5) * smoothstep(0.0, 0.06, vT);
        float nearFade = mix(0.25, 1.0, smoothstep(1.5, 7.0, length(vV))) * smoothstep(0.2, 1.2, length(vV));
        gl_FragColor = vec4(uColor * core * along * nearFade, 1.0);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
  });
}

// Soft radial light pool lying on the floor where a beam lands (cheap stand-in for spill on the carpet).
function lightPoolMaterial(color) {
  return new THREE.MeshBasicMaterial({
    map: glowTexture(), color: new THREE.Color(color).multiplyScalar(POOL_STRENGTH),
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  });
}

// Builds every fixture: merged bodies (1 draw call), merged lenses (1), one cone + one floor pool per beam.
// Returns the beam list for the dust shader: [{ apex, dir, length, color }].
function buildCeilingCans() {
  const beamGeo = new THREE.ConeGeometry(Math.tan(BEAM_HALF_ANGLE), 1, 28, 1, true);
  beamGeo.translate(0, -0.5, 0);               // unit cone: apex at the origin, wide end at y = -1
  const poolGeo = new THREE.PlaneGeometry(1, 1);
  poolGeo.rotateX(-Math.PI / 2);

  const metal = [], lenses = [], beams = [];
  const beamMats = {}, poolMats = {};
  const dir = new THREE.Vector3(), from = new THREE.Vector3(), quat = new THREE.Quaternion(), mat4 = new THREE.Matrix4();
  const one = new THREE.Vector3(1, 1, 1);

  for (const can of CEILING_CANS) {
    const ty = can.ty || 0;
    from.set(can.x, CAN_HEIGHT, can.z);
    dir.set(can.tx - can.x, ty - CAN_HEIGHT, can.tz - can.z);
    const length = dir.length();
    dir.normalize();
    quat.setFromUnitVectors(_canUp, dir);
    mat4.compose(from, quat, one);

    const parts = lightCanGeometries(mat4, can.color);
    metal.push(...parts.metal);
    lenses.push(parts.lens);

    // Ceiling stem so the can visibly hangs from the ceiling.
    const stem = new THREE.CylinderGeometry(0.012, 0.012, ROOM.h - CAN_HEIGHT - 0.1, 6);
    stem.translate(can.x, (ROOM.h + CAN_HEIGHT) / 2 + 0.06, can.z);
    metal.push(stem);

    const beamKey = can.color;
    const beam = new THREE.Mesh(beamGeo, beamMats[beamKey] || (beamMats[beamKey] = lightBeamMaterial(can.color, BEAM_STRENGTH)));
    beam.position.copy(from);
    beam.quaternion.copy(quat);
    beam.scale.setScalar(length);
    beam.renderOrder = 2;
    beam.frustumCulled = false;                // cones are large and cheap; avoids popping at the edge
    scene.add(beam);

    const halo = neonGlowSprite(can.color, 0.8, 1.1);   // bloom-like halo around the lens
    halo.position.copy(from);
    scene.add(halo);

    if (can.pool !== false) {                  // `pool: false` where the beam ends on furniture, not the floor
      const pool = new THREE.Mesh(poolGeo, poolMats[beamKey] || (poolMats[beamKey] = lightPoolMaterial(can.color)));
      pool.position.set(can.tx, ty + 0.014, can.tz);
      pool.scale.setScalar(Math.tan(BEAM_HALF_ANGLE) * length * 2.6);
      pool.renderOrder = 1;
      scene.add(pool);
    }

    beams.push({ apex: from.clone(), dir: dir.clone(), length, color: new THREE.Color(can.color) });

    if (can.real) {
      lightAddSpot(can.color, can.intensity, [can.x, CAN_HEIGHT - 0.05, can.z], [can.tx, ty, can.tz], SPOT_ANGLE, 'can' + beams.length);
    }
  }

  const bodyMesh = new THREE.Mesh(mergeGeometries(metal),
    new THREE.MeshStandardMaterial({ color: 0x14141c, metalness: 0.85, roughness: 0.38 }));
  const lensMesh = new THREE.Mesh(mergeGeometries(lenses), new THREE.MeshBasicMaterial({ vertexColors: true }));
  scene.add(bodyMesh, lensMesh);
  return beams;
}

// ── Haze & dust motes ─────────────────────────────────────────────────────────────────────────
// Every mote is animated in the vertex shader from a time uniform (no per-particle JS). Motes that drift
// through a beam glint in the beam's colour.
function buildDust(beams) {
  const rand = rng(1337);
  const pos = new Float32Array(MOTE_COUNT * 3), seed = new Float32Array(MOTE_COUNT * 4);
  for (let i = 0; i < MOTE_COUNT; i++) {
    pos.set([(rand() - 0.5) * (ROOM.w - 1), rand() * ROOM.h, (rand() - 0.5) * (ROOM.d - 1)], i * 3);
    seed.set([rand(), 0.4 + rand() * 0.9, 0.6 + rand() * 0.8, rand()], i * 4);   // phase, speed, size, tint
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 20);   // motes wrap inside the room; never cull

  const n = beams.length;
  const apex = beams.map((b) => new THREE.Vector4(b.apex.x, b.apex.y, b.apex.z, Math.tan(BEAM_HALF_ANGLE)));
  const dirs = beams.map((b) => new THREE.Vector4(b.dir.x, b.dir.y, b.dir.z, b.length));
  const cols = beams.map((b) => new THREE.Vector3(b.color.r, b.color.g, b.color.b));

  const material = new THREE.ShaderMaterial({
    defines: { BEAMS: n },
    uniforms: {
      uTime: { value: 0 }, uViewH: { value: 540 }, uSize: { value: MOTE_SIZE }, uRoomH: { value: ROOM.h },
      uAlpha: { value: MOTE_BASE_ALPHA }, uBoost: { value: MOTE_BEAM_BOOST },
      uBeamApex: { value: apex }, uBeamDir: { value: dirs }, uBeamCol: { value: cols },
    },
    vertexShader: /* glsl */`
      attribute vec4 aSeed;
      uniform float uTime, uViewH, uSize, uRoomH, uAlpha, uBoost;
      uniform vec4 uBeamApex[BEAMS];
      uniform vec4 uBeamDir[BEAMS];
      uniform vec3 uBeamCol[BEAMS];
      varying vec3 vColor; varying float vAlpha;
      void main() {
        float t = uTime * aSeed.y * 0.35;
        vec3 p = position;
        p.x += sin(t + aSeed.x * 40.0) * 0.55 + sin(t * 0.37 + aSeed.w * 20.0) * 0.3;
        p.z += cos(t * 0.8 + aSeed.x * 23.0) * 0.55;
        p.y = mod(p.y + uTime * 0.018 * aSeed.y, uRoomH);                   // slow rise, wraps at the ceiling

        // Base dust colour: cool grey-violet, a few warm specks.
        vec3 base = mix(vec3(0.55, 0.6, 0.95), vec3(1.0, 0.75, 0.55), step(0.86, aSeed.w));
        vec3 glint = vec3(0.0);
        for (int i = 0; i < BEAMS; i++) {                                    // brighten inside each beam cone
          vec3 rel = p - uBeamApex[i].xyz;
          float s = dot(rel, uBeamDir[i].xyz);
          float r = length(rel - uBeamDir[i].xyz * s);
          float cone = uBeamApex[i].w * s;
          float inside = step(0.0, s) * step(s, uBeamDir[i].w) * (1.0 - smoothstep(0.35, 1.0, r / max(cone, 0.001)));
          glint += uBeamCol[i] * inside;
        }
        float twinkle = 0.65 + 0.35 * sin(uTime * (0.6 + aSeed.y) + aSeed.x * 60.0);
        vColor = base * 0.55 + glint * uBoost * 2.2;
        float edgeFade = smoothstep(0.0, 0.5, p.y) * (1.0 - smoothstep(uRoomH - 0.5, uRoomH, p.y));   // fade near floor/ceiling
        vec4 mv = viewMatrix * vec4(p, 1.0);
        float nearFade = smoothstep(0.35, 1.6, -mv.z);
        vAlpha = uAlpha * twinkle * edgeFade * nearFade * (1.0 + length(glint) * 2.5);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(uSize * aSeed.z * projectionMatrix[1][1] * uViewH * 0.5 / max(-mv.z, 0.1), 1.5, 12.0);
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vColor; varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5) * 2.0;
        float soft = pow(clamp(1.0 - d, 0.0, 1.0), 1.6);
        gl_FragColor = vec4(vColor * soft * vAlpha, 1.0);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
  });

  const points = new THREE.Points(geo, material);
  points.frustumCulled = false;
  points.renderOrder = 3;
  scene.add(points);

  // Only two uniforms change at runtime: time, and the viewport height (for point sizes).
  onUpdate((t) => {
    material.uniforms.uTime.value = t;
    material.uniforms.uViewH.value = canvas.height;
  });
}

// ── Neon flicker ──────────────────────────────────────────────────────────────────────────────
// Event-driven: sleeps until the next scheduled event, buzzes one light for < 1 s, then sleeps again.
function setupFlicker() {
  const rand = rng(90210);
  const targets = FLICKER_LIGHTS.map((n) => _lightByName[n]).filter(Boolean);
  if (!targets.length) return;
  let nextAt = 6 + rand() * 8;                 // first event a few seconds after the start
  let until = 0, light = null;

  onUpdate((t) => {
    if (light) {
      if (t < until) {
        const step = Math.floor(t * 34);       // buzz at ~34 Hz: on/off decided per step from a hash
        const on = ((Math.sin(step * 12.9898) * 43758.5453) % 1 + 1) % 1 > 0.42;
        light.intensity = light.userData.baseIntensity * (on ? 1 : 0.12);
      } else {
        light.intensity = light.userData.baseIntensity;
        light = null;
        nextAt = t + FLICKER_MIN + rand() * (FLICKER_MAX - FLICKER_MIN);
      }
    } else if (t >= nextAt) {
      light = targets[Math.floor(rand() * targets.length)];
      until = t + FLICKER_LENGTH[0] + rand() * (FLICKER_LENGTH[1] - FLICKER_LENGTH[0]);
    }
  });
}

// ── Public helper: additive neon glow sprite ──────────────────────────────────────────────────
// neonGlowSprite(color, size = 1, intensity = 1.6) -> THREE.Sprite
//   A soft round glow that always faces the camera; put it on a sign, a lamp or a light bulb for a halo.
//   `color` is a hex int, `size` the sprite's diameter in metres, `intensity` an HDR multiplier (1..3).
//   The texture is shared and materials are cached per colour+intensity, so many sprites stay cheap
//   (one draw call each). It writes no depth and is not fogged; set sprite.position and scene.add() it.
let _glowTexture = null;
const _glowMaterials = new Map();

function glowTexture() {
  if (_glowTexture) return _glowTexture;
  const { canvas: c, ctx } = makeCanvas(128, 128);
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.10, 'rgba(255,255,255,0.72)');
  g.addColorStop(0.30, 'rgba(255,255,255,0.24)');
  g.addColorStop(0.60, 'rgba(255,255,255,0.05)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  _glowTexture = canvasTexture(c, { srgb: false, anisotropy: 1 });
  return _glowTexture;
}

function neonGlowSprite(color, size = 1, intensity = 1.6) {
  const key = color + ':' + intensity;
  let material = _glowMaterials.get(key);
  if (!material) {
    material = new THREE.SpriteMaterial({
      map: glowTexture(), color: new THREE.Color(color).multiplyScalar(intensity),
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, fog: false,
    });
    _glowMaterials.set(key, material);
  }
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(size, size, 1);
  return sprite;
}

// ── Entry point ───────────────────────────────────────────────────────────────────────────────
function buildLighting() {
  scene.fog = new THREE.FogExp2(FOG_COLOR, FOG_DENSITY);
  buildEnvironment();

  lightRegister(new THREE.HemisphereLight(HEMI.sky, HEMI.ground, HEMI.intensity), 'hemi');
  POINT_LIGHTS.forEach(lightAddPoint);
  lightAddSpot(DOOR_SPOT.color, DOOR_SPOT.intensity, [DOOR_SPOT.x, DOOR_SPOT.y, DOOR_SPOT.z],
    [DOOR_SPOT.tx, DOOR_SPOT.ty, DOOR_SPOT.tz], DOOR_SPOT.angle, 'door');

  const beams = buildCeilingCans();            // also adds the SpotLights of the "real" cans
  buildDust(beams);
  setupFlicker();
}

// ═══════════════ ROOM SHELL: carpet, wall panels, ceiling structure, entrance, neon architecture ═══════════════
// Owner: room agent. Entry point: buildRoom().  Runs after buildLighting() and before every other builder.
//
// What lives here (all procedural, no external files):
//   floor      space-age confetti carpet (map + emissive + pile bump/roughness), a wear/stain overlay,
//              a black-and-white vinyl threshold with a doormat by the entrance
//   walls      dark panel wall texture (seams, wainscot flutes, scuffs), baseboard, chair rail, cornice,
//              corner posts, conduits, vents, two structural pilasters on the north wall
//   ceiling    black corrugated deck, steel truss grid, round/rectangular ducts, pipes, cable trays,
//              an acoustic-tile soffit over the entrance and mount plates for spot cans
//   neon       every glowing bar lives in ONE merged vertex-coloured mesh; soft "light spill" quads are
//              merged into ONE additive mesh (halo) so the neon appears to wash the wall, floor and ceiling
//   entrance   double glass doors in the south wall with a night-street backdrop and light spill
//
// Public API for other parts (top-level constants, valid as soon as the module has evaluated):
//   ROOM_SPOT_MOUNTS  [{x,y,z}]  truss crossings with a mount plate: hang spot cans from these (y = underside of the truss)
//   ROOM_DOOR         {x,z,halfW,h}  the entrance opening in the south wall
//   ROOM_DROP         {z0,y}    the tiled soffit covers z in [z0, 7] at height y (ceiling is lower there)
//   ROOM_TRIM_Y       {cove,line,base}  heights of the neon lines, for props that want to align with them


// ── Layout constants ──
const ROOM_WALL_TILE = 4;                         // the wall texture covers 4 m x 4 m
const ROOM_CARPET_TILE = 3;                       // one carpet tile per 3 m
const ROOM_DECK_TILE = 2;                         // ceiling deck texture covers 2 m x 2 m
const ROOM_DOOR = { x: 0, z: 7, halfW: 1.6, h: 2.5 };
const ROOM_DROP = { z0: 4.4, y: 3.62 };           // acoustic soffit along the entrance wall
const ROOM_TRIM_Y = { base: 0.19, line: 3.2, cove: 3.8 };
const ROOM_TRUSS = { y: 3.78, halfW: 0.15, halfH: 0.14, x: [-7.5, -2.5, 2.5, 7.5], z: [-3.5, 0, 3.5] };
const ROOM_SPOT_MOUNTS = ROOM_TRUSS.z.flatMap((z) => ROOM_TRUSS.x.map((x) => ({ x, y: ROOM_TRUSS.y - ROOM_TRUSS.halfH, z })));
const ROOM_PILASTER_X = [-5.5, 5.5];              // wall-hugging columns on the north wall (outside every reserved zone)
const ROOM_NEON_LEVEL = { line: 3.4, cove: 2.8, base: 2.6, corner: 3.4, accent: 3.0 };   // emissive HDR multipliers (bloom)
const ROOM_CARPET_GLOW = 0.55;                    // blacklight strength of the confetti

const _roomDummy = new THREE.Object3D();          // scratch object for orienting struts (build time only)

// ══════════════════════════ small helpers ══════════════════════════

function roomAnisotropy() { return Math.min(16, renderer.capabilities.getMaxAnisotropy()); }

// Fast xorshift32 stream of bytes for per-pixel noise (rng() closures are too slow for millions of pixels).
function roomByteNoise(seed) {
  let x = (seed * 2654435761) >>> 0 || 1;
  return () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x & 255; };
}

// Adds fine grain (paint / pile speckle) by tiling a small random-alpha noise pattern over the canvas.
function roomGrain(ctx, w, h, amp, seed) {
  const n = 128, tile = makeCanvas(n, n), img = tile.ctx.createImageData(n, n), d = img.data, next = roomByteNoise(seed);
  for (let i = 0; i < d.length; i += 4) {
    const v = next(), light = v & 1;
    d[i] = d[i + 1] = d[i + 2] = light ? 255 : 0;
    d[i + 3] = (next() / 255) * amp * 1.6;
  }
  tile.ctx.putImageData(img, 0, 0);
  ctx.fillStyle = ctx.createPattern(tile.canvas, 'repeat');
  ctx.fillRect(0, 0, w, h);
}

// Calls draw(ctx) once, plus wrapped copies when a shape of radius r at (x,y) crosses a tile edge (tileable art).
function roomDrawWrapped(ctx, size, x, y, r, draw) {
  const xs = [0], ys = [0];
  if (x - r < 0) xs.push(size); if (x + r > size) xs.push(-size);
  if (y - r < 0) ys.push(size); if (y + r > size) ys.push(-size);
  for (const ox of xs) for (const oy of ys) { ctx.save(); ctx.translate(ox, oy); draw(ctx); ctx.restore(); }
}

const roomCss = (hex, a = 1) => `rgba(${(hex >> 16) & 255},${(hex >> 8) & 255},${hex & 255},${a})`;

// ══════════════════════════ geometry builders (collect, then merge) ══════════════════════════

function roomBox(out, sx, sy, sz, x, y, z) {
  const g = new THREE.BoxGeometry(sx, sy, sz);
  g.translate(x, y, z);
  out.push(g);
}

// Cylinder along axis 'x' | 'y' | 'z', centred on (x,y,z).
function roomCyl(out, r, len, axis, x, y, z, seg = 14) {
  const g = new THREE.CylinderGeometry(r, r, len, seg, 1);
  if (axis === 'x') g.rotateZ(Math.PI / 2); else if (axis === 'z') g.rotateX(Math.PI / 2);
  g.translate(x, y, z);
  out.push(g);
}

// Square-section bar from a to b (truss members, hangers).
function roomStrut(out, ax, ay, az, bx, by, bz, t) {
  const g = new THREE.BoxGeometry(t, t, Math.hypot(bx - ax, by - ay, bz - az));
  _roomDummy.position.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2);
  _roomDummy.lookAt(bx, by, bz);
  _roomDummy.updateMatrix();
  g.applyMatrix4(_roomDummy.matrix);
  out.push(g);
}

// A wall rectangle from (ax,az) to (bx,bz) between heights y0..y1 with texture coordinates in wall-tile units.
// Walking a -> b must run clockwise seen from above (north: -x -> +x, east: -z -> +z, south: +x -> -x, west: +z -> -z)
// so the visible face points into the room. `along` = distance from the start of that wall (metres).
function roomWallQuad(out, [ax, az], [bx, bz], y0, y1, along, uShift) {
  const len = Math.hypot(bx - ax, bz - az), T = ROOM_WALL_TILE;
  const nx = -(bz - az) / len, nz = (bx - ax) / len;
  const u0 = (along + uShift) / T, u1 = (along + uShift + len) / T;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([ax, y0, az, bx, y0, bz, bx, y1, bz, ax, y1, az], 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute([nx, 0, nz, nx, 0, nz, nx, 0, nz, nx, 0, nz], 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([u0, y0 / T, u1, y0 / T, u1, y1 / T, u0, y1 / T], 2));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  out.push(g);
}

// Merges a list of geometries into one mesh (one draw call) and adds it to the scene.
function roomFlush(geos, material, { renderOrder = 0 } = {}) {
  if (!geos.length) return null;
  const merged = roomGeo.mergeGeometries(geos, false);
  for (const g of geos) g.dispose();
  const mesh = new THREE.Mesh(merged, material);
  mesh.matrixAutoUpdate = false;
  mesh.renderOrder = renderOrder;
  scene.add(mesh);
  return mesh;
}

// All neon bars share one mesh: vertex colours hold linear HDR colour x intensity (MeshBasicMaterial, unlit).
function roomNeonSet() {
  const geos = [];
  return {
    bar(color, level, sx, sy, sz, x, y, z) {
      const g = new THREE.BoxGeometry(sx, sy, sz);
      g.translate(x, y, z);
      const c = new THREE.Color(color).multiplyScalar(level);
      const n = g.attributes.position.count, arr = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
      g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
      geos.push(g);
    },
    flush() {
      return roomFlush(geos, new THREE.MeshBasicMaterial({ vertexColors: true }));
    },
  };
}

// Soft light spill: additive quads whose vertex colours fade to black (no texture needed), merged into one mesh.
function roomHaloSet() {
  const geos = [];
  const FADE = [0, 0.1, 0.25, 0.45, 0.7, 1];                 // ring offsets, as a fraction of the width
  const falloff = (t) => Math.pow(1 - t, 2.2);
  const make = (pos, col, idx) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    geos.push(g);
  };
  return {
    // Band that starts on the line a-b and extends `width` metres along the unit vector dir, fading out.
    strip(color, strength, a, b, dir, width) {
      const c = new THREE.Color(color), pos = [], col = [], idx = [];
      FADE.forEach((t, i) => {
        const k = strength * falloff(t);
        for (const p of [a, b]) {
          pos.push(p[0] + dir[0] * width * t, p[1] + dir[1] * width * t, p[2] + dir[2] * width * t);
          col.push(c.r * k, c.g * k, c.b * k);
        }
        if (i > 0) { const j = (i - 1) * 2; idx.push(j, j + 1, j + 3, j, j + 3, j + 2); }
      });
      make(pos, col, idx);
    },
    // Elliptical puddle of light lying on the floor (or any y), centred at (cx, y, cz).
    pool(color, strength, cx, y, cz, rx, rz, segs = 28) {
      const c = new THREE.Color(color), pos = [cx, y, cz], col = [c.r * strength, c.g * strength, c.b * strength], idx = [];
      const rings = FADE.slice(1);
      rings.forEach((t, ri) => {
        const k = strength * falloff(t);
        for (let s = 0; s < segs; s++) {
          const ang = (s / segs) * Math.PI * 2;
          pos.push(cx + Math.cos(ang) * rx * t, y, cz + Math.sin(ang) * rz * t);
          col.push(c.r * k, c.g * k, c.b * k);
        }
        const base = 1 + ri * segs, prev = 1 + (ri - 1) * segs;
        for (let s = 0; s < segs; s++) {
          const s2 = (s + 1) % segs;
          if (ri === 0) idx.push(0, base + s2, base + s);
          else idx.push(prev + s, prev + s2, base + s2, prev + s, base + s2, base + s);
        }
      });
      make(pos, col, idx);
    },
    flush() {
      const mat = new THREE.MeshBasicMaterial({
        vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
        polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
      });
      return roomFlush(geos, mat, { renderOrder: 5 });
    },
  };
}

// ══════════════════════════ textures ══════════════════════════

// ── Carpet: navy base + neon space confetti. Returns { map, emissiveMap, pile } canvas textures. ──
const ROOM_CONFETTI = [0x00e5ff, 0x00e5ff, 0xff2bd6, 0xff2bd6, 0x9b5cff, 0x9b5cff, 0xffe600, 0xff8a1f, 0x39ff88, 0xc9c2ff, 0x2f6bff, 0xff2a3a];
const ROOM_SHAPES = ['squiggle', 'squiggle', 'squiggle', 'triangle', 'triangle', 'ring', 'ring', 'dot', 'dot', 'dot', 'star4', 'star4',
                     'star5', 'planet', 'planet', 'bar', 'bar', 'zigzag', 'zigzag', 'arc', 'cross', 'dots'];

// Draws one confetti shape centred on the origin (context already translated and rotated).
function roomConfettiShape(ctx, kind, rad, lw, ring) {
  ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  switch (kind) {
    case 'squiggle':
      for (let i = 0; i <= 28; i++) { const t = i / 28; ctx.lineTo((t - 0.5) * 2 * rad, Math.sin(t * Math.PI * 3) * rad * 0.3); }
      ctx.stroke(); break;
    case 'triangle':
      for (let i = 0; i < 3; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 3; ctx.lineTo(Math.cos(a) * rad * 0.8, Math.sin(a) * rad * 0.8); }
      ctx.closePath(); ctx.stroke(); break;
    case 'ring': ctx.arc(0, 0, rad * 0.55, 0, Math.PI * 2); ctx.stroke(); break;
    case 'dot': ctx.arc(0, 0, rad * 0.32, 0, Math.PI * 2); ctx.fill(); break;
    case 'star4':
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, q = i % 2 ? rad * 0.2 : rad * 0.8; ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q); }
      ctx.closePath(); ctx.fill(); break;
    case 'star5':
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? rad * 0.34 : rad * 0.75; ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q); }
      ctx.closePath(); ctx.fill(); break;
    case 'planet': {
      const globe = ctx.fillStyle;
      ctx.strokeStyle = ring; ctx.lineWidth = lw * 0.55;
      ctx.ellipse(0, 0, rad * 1.0, rad * 0.3, -0.45, Math.PI, Math.PI * 2); ctx.stroke();  // back half of the ring
      ctx.fillStyle = globe; ctx.beginPath(); ctx.arc(0, 0, rad * 0.44, 0, Math.PI * 2); ctx.fill();   // globe
      ctx.beginPath(); ctx.ellipse(0, 0, rad * 1.0, rad * 0.3, -0.45, 0, Math.PI); ctx.stroke(); break;   // front half
    }
    case 'bar': ctx.moveTo(-rad * 0.7, 0); ctx.lineTo(rad * 0.7, 0); ctx.stroke(); break;
    case 'zigzag':
      for (let i = 0; i <= 5; i++) ctx.lineTo((i / 5 - 0.5) * 2 * rad * 0.9, (i % 2 ? -1 : 1) * rad * 0.24);
      ctx.stroke(); break;
    case 'arc': ctx.arc(0, 0, rad * 0.7, 0.15 * Math.PI, 1.15 * Math.PI); ctx.stroke(); break;
    case 'cross': ctx.moveTo(-rad * 0.4, 0); ctx.lineTo(rad * 0.4, 0); ctx.moveTo(0, -rad * 0.4); ctx.lineTo(0, rad * 0.4); ctx.stroke(); break;
    default:   // 'dots': a short dotted line
      for (let i = -1; i <= 2; i++) { ctx.moveTo(i * rad * 0.4, 0); ctx.arc(i * rad * 0.4, 0, lw * 0.55, 0, Math.PI * 2); }
      ctx.fill();
  }
}

function roomCarpetTextures() {
  const S = 1024, P = 512, r = rng(1993);
  const col = makeCanvas(S, S), glow = makeCanvas(S, S), pile = makeCanvas(P, P);

  // Base: navy with soft tonal blotches (wrapped, so the tile stays seamless).
  col.ctx.fillStyle = '#0b0c26'; col.ctx.fillRect(0, 0, S, S);
  glow.ctx.fillStyle = '#000'; glow.ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 70; i++) {
    const x = r() * S, y = r() * S, rad = 60 + r() * 140, light = r() < 0.5;
    roomDrawWrapped(col.ctx, S, x, y, rad, (c) => {
      const g = c.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, light ? 'rgba(60,50,120,0.16)' : 'rgba(0,0,10,0.28)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    });
  }

  // Confetti by dart-throwing so shapes never overlap; each shape is drawn into the colour and emissive canvases.
  const placed = [];
  for (let attempt = 0; attempt < 9000 && placed.length < 150; attempt++) {
    const kind = ROOM_SHAPES[Math.floor(r() * ROOM_SHAPES.length)];
    const rad = kind === 'dot' ? 12 + r() * 8 : kind === 'dots' ? 30 + r() * 10 : 30 + r() * 26;
    const x = r() * S, y = r() * S;
    const clash = placed.some((p) => {
      const dx = Math.min(Math.abs(p.x - x), S - Math.abs(p.x - x)), dy = Math.min(Math.abs(p.y - y), S - Math.abs(p.y - y));
      return Math.hypot(dx, dy) < (p.rad + rad) * 0.95 + 8;
    });
    if (clash) continue;
    const color = ROOM_CONFETTI[Math.floor(r() * ROOM_CONFETTI.length)], rot = r() * Math.PI * 2, lw = 7 + r() * 4;
    const ringColor = ROOM_CONFETTI[Math.floor(r() * ROOM_CONFETTI.length)];
    placed.push({ x, y, rad });
    const paint = (target, alpha, blur) => roomDrawWrapped(target.ctx, S, x, y, rad, (c) => {
      c.translate(x, y); c.rotate(rot);
      c.strokeStyle = c.fillStyle = roomCss(color, alpha);
      c.shadowColor = roomCss(color, 0.9); c.shadowBlur = blur;
      roomConfettiShape(c, kind, rad, lw, roomCss(ringColor, alpha));
    });
    paint(col, 0.78, 0);
    paint(glow, 0.9, 6);
  }
  roomGrain(col.ctx, S, S, 12, 5);

  // Pile: R = height (tufts + fibre noise), G = roughness (mostly rough).
  const img = pile.ctx.createImageData(P, P), d = img.data, n = P / 4, tufts = new Uint8Array(n * n), next = roomByteNoise(77);
  for (let i = 0; i < tufts.length; i++) tufts[i] = next();
  for (let y = 0; y < P; y++) for (let x = 0; x < P; x++) {
    const i = (y * P + x) * 4;
    d[i] = 70 + (tufts[(y >> 2) * n + (x >> 2)] * 90 + next() * 80) / 255;
    d[i + 1] = 228 + next() * 27 / 255; d[i + 2] = 0; d[i + 3] = 255;
  }
  pile.ctx.putImageData(img, 0, 0);

  const rep = [ROOM.w / ROOM_CARPET_TILE, ROOM.d / ROOM_CARPET_TILE], an = roomAnisotropy();
  return {
    map: canvasTexture(col.canvas, { repeat: rep, anisotropy: an }),
    emissiveMap: canvasTexture(glow.canvas, { repeat: rep, anisotropy: an }),
    pile: canvasTexture(pile.canvas, { srgb: false, repeat: rep, anisotropy: an }),
  };
}

// ── Wear overlay for the whole floor (traffic lanes, stains, gum): black with alpha, 32 px per metre. ──
function roomWearTexture() {
  const PPM = 32, W = ROOM.w * PPM, H = ROOM.d * PPM, r = rng(88);
  const { canvas, ctx } = makeCanvas(W, H);
  const px = (x) => (x + ROOM.w / 2) * PPM, pz = (z) => (z + ROOM.d / 2) * PPM;
  const stamp = (x, y, rad, a) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  };
  // Where people actually walk: door -> aisles -> prize counter, the wall rows and the front aisle.
  const lanes = [
    [[0, 7], [0, 4.4], [-3.2, 2.6], [-3.2, -3.6], [-1.6, -4.5]], [[0, 4.4], [3.2, 2.6], [3.2, -3.2], [1.6, -4.5]],
    [[-8, 4.4], [8, 4.4]], [[-7.9, 4.2], [-7.9, -4.2]], [[7.9, 3.8], [7.9, -4.2]], [[-3.2, -4.6], [3.2, -4.6]],
  ];
  for (const lane of lanes) {
    for (let s = 0; s < lane.length - 1; s++) {
      const [a, b] = [lane[s], lane[s + 1]], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      for (let t = 0; t < len; t += 0.18) {
        const k = t / len, j = (r() - 0.5) * 0.5;
        stamp(px(a[0] + (b[0] - a[0]) * k + j), pz(a[1] + (b[1] - a[1]) * k + j), (0.6 + r() * 0.55) * PPM, 0.14 + r() * 0.07);
      }
    }
  }
  for (let i = 0; i < 26; i++) stamp(r() * W, r() * H, (0.25 + r() * 0.5) * PPM, 0.08 + r() * 0.12);    // spills
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  for (let i = 0; i < 90; i++) { ctx.beginPath(); ctx.arc(r() * W, r() * H, 0.8 + r() * 1.4, 0, Math.PI * 2); ctx.fill(); }   // gum
  return canvasTexture(canvas, { anisotropy: roomAnisotropy() });
}

// ── Wall panels. Colour map (1024) for 4 m x 4 m plus a height map (512, R = bump, G = roughness). ──
function roomPaintWall(ctx, S, K) {
  const ppm = S / ROOM_WALL_TILE, k = S / 1024, r = rng(2718), Y = (m) => S - m * ppm;
  ctx.fillStyle = K.base; ctx.fillRect(0, 0, S, S);
  // Painted-over unevenness.
  for (let i = 0; i < 20; i++) {
    const x = r() * S, y = r() * S, rad = (50 + r() * 130) * k, g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, r() < 0.5 ? K.blotchA : K.blotchB); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  // Wainscot (0 - 1.05 m): darker fluted panelling; chair-rail band above it.
  ctx.fillStyle = K.wain; ctx.fillRect(0, Y(1.05), S, 1.05 * ppm);
  for (let x = 0; x < S; x += 0.09 * ppm) {
    ctx.fillStyle = K.groove; ctx.fillRect(x, Y(1.05), 3.5 * k, 1.05 * ppm);
    ctx.fillStyle = K.flute; ctx.fillRect(x + 3.5 * k, Y(1.05), 2 * k, 1.05 * ppm);
  }
  ctx.fillStyle = K.rail; ctx.fillRect(0, Y(1.13), S, 0.08 * ppm);
  ctx.fillStyle = K.groove; ctx.fillRect(0, Y(1.13), S, 3 * k);
  // Sheet-panel seams every metre with screw heads.
  for (let i = 0; i < 4; i++) {
    const x = i * ppm;
    for (const ox of i === 0 ? [0, S] : [0]) {
      ctx.fillStyle = K.groove; ctx.fillRect(x + ox - 2 * k, Y(4), 4 * k, 2.87 * ppm);
      ctx.fillStyle = K.seamHi; ctx.fillRect(x + ox + 2 * k, Y(4), 1.5 * k, 2.87 * ppm);
      ctx.fillStyle = K.screw;
      for (const m of [1.35, 2.2, 3.05, 3.85]) { ctx.beginPath(); ctx.arc(x + ox + 9 * k, Y(m), 2.6 * k, 0, Math.PI * 2); ctx.fill(); }
    }
  }
  // Horizontal joint of the upper sheets.
  ctx.fillStyle = K.groove; ctx.fillRect(0, Y(2.6), S, 2.5 * k);
  // Rain-streak grime from the ceiling, dirt near the floor.
  for (let i = 0; i < 46; i++) {
    const x = r() * S, len = (0.3 + r() * 1.1) * ppm, w = (4 + r() * 12) * k, g = ctx.createLinearGradient(0, 0, 0, len);
    g.addColorStop(0, K.grime); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.translate(x, 0); ctx.fillStyle = g; ctx.fillRect(0, 0, w, len); ctx.restore();
  }
  const dirt = ctx.createLinearGradient(0, Y(0.9), 0, S);
  dirt.addColorStop(0, 'rgba(0,0,0,0)'); dirt.addColorStop(1, K.dirt);
  ctx.fillStyle = dirt; ctx.fillRect(0, Y(0.9), S, 0.9 * ppm);
  // Scuffs and scratches, mostly low on the wall.
  ctx.lineCap = 'round';
  for (let i = 0; i < 130; i++) {
    const low = r() < 0.75, y = low ? Y(r() * 1.6) : Y(1.6 + r() * 2.2), x = r() * S, len = (12 + r() * 60) * k, a = (r() - 0.5) * 0.7;
    ctx.strokeStyle = K.scuff; ctx.lineWidth = (1.5 + r() * 3.5) * k;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + len / 2, y + a * len * 0.4, x + len, y + a * len); ctx.stroke();
  }
}

function roomWallTextures() {
  const an = roomAnisotropy();
  const colour = makeCanvas(1024, 1024), height = makeCanvas(512, 512);
  roomPaintWall(colour.ctx, 1024, {
    base: '#27213f', wain: '#1b1731', groove: '#0b0918', flute: 'rgba(120,110,170,0.10)', rail: '#3b3558', seamHi: 'rgba(150,140,200,0.10)',
    screw: '#4c4670', grime: 'rgba(0,0,0,0.22)', dirt: 'rgba(0,0,0,0.45)', scuff: 'rgba(190,180,215,0.13)',
    blotchA: 'rgba(90,70,150,0.10)', blotchB: 'rgba(0,0,10,0.16)',
  });
  roomGrain(colour.ctx, 1024, 1024, 10, 6);
  roomPaintWall(height.ctx, 512, {
    base: '#808080', wain: '#808080', groove: '#2a2a2a', flute: '#a8a8a8', rail: '#b0b0b0', seamHi: '#a0a0a0',
    screw: '#c0c0c0', grime: 'rgba(0,0,0,0)', dirt: 'rgba(0,0,0,0)', scuff: 'rgba(220,220,220,0.5)',
    blotchA: 'rgba(150,150,150,0.10)', blotchB: 'rgba(100,100,100,0.10)',
  });
  // Grain + roughness channel (scuffed spots are glossier).
  const img = height.ctx.getImageData(0, 0, 512, 512), d = img.data, next = roomByteNoise(9);
  for (let i = 0; i < d.length; i += 4) {
    const h = d[i] + (next() / 255 - 0.5) * 22; d[i] = h; d[i + 1] = 205 + (h - 128) * 0.3; d[i + 2] = 0;
  }
  height.ctx.putImageData(img, 0, 0);
  const rep = { repeat: [1, 1], anisotropy: an };   // repeat [1,1] just switches on RepeatWrapping; UVs are in wall-tile units
  return { map: canvasTexture(colour.canvas, rep), bump: canvasTexture(height.canvas, { srgb: false, ...rep }) };
}

// ── Ceiling deck: black corrugated steel, ribs along x. One canvas used as colour and bump. ──
function roomDeckTexture() {
  const S = 512, { canvas, ctx } = makeCanvas(S, S), r = rng(31), rib = S / (ROOM_DECK_TILE * 10);   // 10 ribs per metre
  ctx.fillStyle = '#15151d'; ctx.fillRect(0, 0, S, S);
  for (let y = 0; y < S; y += rib) {
    const g = ctx.createLinearGradient(0, y, 0, y + rib);
    g.addColorStop(0, '#08080d'); g.addColorStop(0.35, '#23232e'); g.addColorStop(0.6, '#15151d'); g.addColorStop(1, '#08080d');
    ctx.fillStyle = g; ctx.fillRect(0, y, S, rib);
  }
  for (let i = 0; i < 30; i++) {          // dust and soot
    const x = r() * S, y = r() * S, rad = 30 + r() * 80, g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, 'rgba(0,0,0,0.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  roomGrain(ctx, S, S, 10, 12);
  return canvasTexture(canvas, { repeat: [ROOM.w / ROOM_DECK_TILE, ROOM.d / ROOM_DECK_TILE], anisotropy: roomAnisotropy() });
}

// ── Acoustic drop-ceiling tiles: 4 x 4 tiles of 0.6 m in one 512 px canvas, black-painted with a steel T-bar grid. ──
function roomTileTexture(width, depth) {
  const S = 512, { canvas, ctx } = makeCanvas(S, S), r = rng(57), cell = S / 4;
  ctx.fillStyle = '#1a1a21'; ctx.fillRect(0, 0, S, S);
  for (let ty = 0; ty < 4; ty++) for (let tx = 0; tx < 4; tx++) {
    const x0 = tx * cell, y0 = ty * cell, shade = r();
    ctx.fillStyle = shade < 0.2 ? '#2a2a33' : shade < 0.6 ? '#1d1d25' : '#16161c'; ctx.fillRect(x0, y0, cell, cell);
    if (r() < 0.25) {                       // water stain
      const g = ctx.createRadialGradient(x0 + r() * cell, y0 + r() * cell, 2, x0 + cell / 2, y0 + cell / 2, cell * 0.6);
      g.addColorStop(0, 'rgba(70,52,30,0.35)'); g.addColorStop(1, 'rgba(70,52,30,0)');
      ctx.fillStyle = g; ctx.fillRect(x0, y0, cell, cell);
    }
    for (let i = 0; i < 260; i++) {        // fissures and pinholes
      ctx.fillStyle = r() < 0.5 ? 'rgba(0,0,0,0.55)' : 'rgba(120,120,140,0.16)';
      ctx.fillRect(x0 + r() * cell, y0 + r() * cell, 1 + r() * 2, 1 + r());
    }
  }
  ctx.fillStyle = '#3c3d48';                // T-bars
  for (let i = 0; i <= 4; i++) {
    ctx.fillRect(i * cell - 3, 0, 6, S); ctx.fillRect(0, i * cell - 3, S, 6);
  }
  ctx.fillStyle = 'rgba(200,205,225,0.22)';
  for (let i = 0; i <= 4; i++) { ctx.fillRect(i * cell - 3, 0, 1.5, S); ctx.fillRect(0, i * cell - 3, S, 1.5); }
  return canvasTexture(canvas, { repeat: [width / 2.4, depth / 2.4], anisotropy: roomAnisotropy() });
}

// ── Threshold vinyl (checkerboard) with a rubber doormat. 4.2 m x 1.2 m at 240 px/m. ──
const ROOM_THRESHOLD = { x0: -2.1, x1: 2.1, z0: 5.8, z1: 7.0 };
function roomDrawThreshold(ctx, W, H) {
  const ppm = 240, tile = 0.3 * ppm, r = rng(70);
  for (let ty = 0; ty < H / tile; ty++) for (let tx = 0; tx < W / tile; tx++) {
    const light = (tx + ty) % 2 === 0, j = r() * 10;
    ctx.fillStyle = light ? `rgb(${112 + j},${110 + j},${124 + j})` : `rgb(${10 + j / 2},${10 + j / 2},${16 + j / 2})`;
    ctx.fillRect(tx * tile, ty * tile, tile + 1, tile + 1);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)';                                   // grout lines
  for (let x = 0; x <= W; x += tile) ctx.fillRect(x - 1, 0, 2, H);
  for (let y = 0; y <= H; y += tile) ctx.fillRect(0, y - 1, W, 2);
  for (let i = 0; i < 24; i++) {                                         // scuffs
    ctx.strokeStyle = `rgba(200,200,220,${0.08 + r() * 0.12})`; ctx.lineWidth = 1 + r() * 2;
    const x = r() * W, y = r() * H; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 10 + r() * 40, y + (r() - 0.5) * 14); ctx.stroke();
  }
  // Doormat, 2.6 m x 0.8 m, centred in the strip.
  const mw = 2.6 * ppm, mh = 0.8 * ppm, mx = (W - mw) / 2, my = 0.25 * ppm;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(mx - 5, my - 3, mw + 10, mh + 12);
  ctx.fillStyle = '#12141b'; ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = '#1fa7bd'; ctx.lineWidth = 5; ctx.strokeRect(mx + 10, my + 10, mw - 20, mh - 20);
  ctx.strokeStyle = '#b1268f'; ctx.lineWidth = 3; ctx.strokeRect(mx + 20, my + 20, mw - 40, mh - 40);
  for (let i = 0; i < 1400; i++) { ctx.fillStyle = `rgba(255,255,255,${r() * 0.05})`; ctx.fillRect(mx + r() * mw, my + r() * mh, 2, 2); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `28px ${ARCADE_FONT}`; ctx.fillStyle = '#34c8dd'; ctx.fillText('WELCOME', W / 2, my + mh * 0.38);
  ctx.font = `15px ${ARCADE_FONT}`; ctx.fillStyle = '#d347b5'; ctx.fillText('PLAYER ONE', W / 2, my + mh * 0.68);
}

function roomThresholdTexture() {
  const W = 1008, H = 288, { canvas, ctx } = makeCanvas(W, H);
  const tex = canvasTexture(canvas, { anisotropy: roomAnisotropy() });
  roomDrawThreshold(ctx, W, H);
  fontsReady.then(() => { roomDrawThreshold(ctx, W, H); tex.needsUpdate = true; });
  return tex;
}

// ── Night street seen through the doors: sky, skyline with neon signs, wet road, street lamps, blurred bokeh. 1024 x 512. ──
function roomStreetTexture() {
  const W = 1024, H = 512, HZ = H * 0.62, r = rng(404), { canvas, ctx } = makeCanvas(W, H);
  let g = ctx.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, '#01030f'); g.addColorStop(0.6, '#07112e'); g.addColorStop(1, '#173a6a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ);
  g = ctx.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, '#132c4d'); g.addColorStop(1, '#04070f');
  ctx.fillStyle = g; ctx.fillRect(0, HZ, W, H - HZ);
  // Skyline in two depth layers with lit windows.
  for (const [colour, minH, maxH, winA] of [['#0a1430', 70, 200, 0.5], ['#050a19', 30, 120, 0.85]]) {
    for (let x = -10; x < W;) {
      const bw = 36 + r() * 90, bh = minH + r() * (maxH - minH);
      ctx.fillStyle = colour; ctx.fillRect(x, HZ - bh, bw, bh + 2);
      for (let wy = HZ - bh + 8; wy < HZ - 6; wy += 13) for (let wx = x + 6; wx < x + bw - 8; wx += 12) {
        if (r() < 0.2) { ctx.fillStyle = r() < 0.7 ? `rgba(255,190,100,${winA * 0.6})` : `rgba(120,220,255,${winA * 0.6})`; ctx.fillRect(wx, wy, 4, 6); }
      }
      x += bw + r() * 10;
    }
  }
  const lights = [];                                     // bright spots that get a wet-road reflection
  // Neon shop signs across the street (soft via shadowBlur).
  for (const [x, y, sw, sh, c] of [[150, HZ - 70, 110, 9, 0xff2bd6], [430, HZ - 118, 8, 62, 0x00e5ff], [640, HZ - 52, 90, 8, 0xffb347], [880, HZ - 96, 70, 8, 0x39ff88]]) {
    ctx.shadowColor = roomCss(c, 1); ctx.shadowBlur = 20; ctx.fillStyle = roomCss(c, 0.95); ctx.fillRect(x, y, sw, sh);
    ctx.shadowBlur = 0; lights.push({ x: x + sw / 2, y: y + sh, rad: Math.max(sw, sh) * 0.3, c });
  }
  // Street lamps: dark pole, warm head.
  for (const x of [300, 780]) {
    ctx.fillStyle = '#03060e'; ctx.fillRect(x - 3, HZ - 170, 6, 190); ctx.fillRect(x - 3, HZ - 172, 30, 5);
    lights.push({ x: x + 26, y: HZ - 160, rad: 22, c: 0xffc46b });
  }
  ctx.globalCompositeOperation = 'lighter';
  const bokeh = (x, y, rad, colour, a) => {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, roomCss(colour, a * 0.7)); rg.addColorStop(0.75, roomCss(colour, a * 0.5)); rg.addColorStop(1, roomCss(colour, 0));
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  };
  const tints = [0xff2bd6, 0x00e5ff, 0xffb347, 0xff3a4a, 0x39ff88, 0xffffff, 0x9b5cff];
  for (const l of lights) bokeh(l.x, l.y, l.rad * 2.4, l.c, 0.45);
  for (let i = 0; i < 70; i++) {                         // small distant bokeh around the skyline
    const x = r() * W, y = HZ - 110 + r() * 130, rad = 5 + r() * 15, c = tints[Math.floor(r() * tints.length)];
    bokeh(x, y, rad, c, 0.5 + r() * 0.4);
  }
  for (let i = 0; i < 5; i++) bokeh(r() * W, HZ - 120 + r() * 160, 34 + r() * 24, tints[Math.floor(r() * 4)], 0.14);   // big soft discs
  for (let i = 0; i < 26; i++) {                         // headlights and tail lights on the road
    const x = r() * W, y = HZ + 4 + r() * 22, c = r() < 0.5 ? 0xffe9c0 : 0xff2a3a, rad = 5 + r() * 7;
    bokeh(x, y, rad, c, 0.9); lights.push({ x, y, rad, c });
  }
  for (const l of lights) {                              // wet-road reflections: vertical smears under each light
    const len = 45 + l.rad * 5, sg = ctx.createLinearGradient(0, Math.max(l.y, HZ), 0, HZ + len);
    sg.addColorStop(0, roomCss(l.c, 0.3)); sg.addColorStop(1, roomCss(l.c, 0));
    ctx.fillStyle = sg; ctx.fillRect(l.x - Math.max(3, l.rad * 0.4), Math.max(l.y, HZ), Math.max(6, l.rad * 0.8), len);
  }
  ctx.globalCompositeOperation = 'source-over';
  return canvasTexture(canvas, { anisotropy: 4 });
}

// ── Door glass: faint tint, reflection streaks, fingerprints and vinyl decals. Left leaf = left half, right leaf = right half. ──
function roomDrawGlass(ctx, W, H) {
  ctx.clearRect(0, 0, W, H);
  const r = rng(12), half = W / 2;
  for (let leaf = 0; leaf < 2; leaf++) {
    ctx.save(); ctx.translate(leaf * half, 0);
    ctx.fillStyle = 'rgba(110,160,215,0.10)'; ctx.fillRect(0, 0, half, H);
    for (const [x, w, a] of [[0.15, 0.10, 0.10], [0.42, 0.05, 0.08], [0.6, 0.16, 0.06]]) {      // slanted reflections
      const g = ctx.createLinearGradient(x * half, 0, (x + w) * half, 0);
      g.addColorStop(0, 'rgba(200,225,255,0)'); g.addColorStop(0.5, `rgba(200,225,255,${a})`); g.addColorStop(1, 'rgba(200,225,255,0)');
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(x * half + 90, 0); ctx.lineTo((x + w) * half + 90, 0); ctx.lineTo((x + w) * half - 90, H); ctx.lineTo(x * half - 90, H); ctx.fill();
    }
    for (let i = 0; i < 26; i++) {           // smudges around hand height
      const x = r() * half, y = H * (0.42 + r() * 0.2), rad = 6 + r() * 16, g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, 'rgba(220,230,255,0.07)'); g.addColorStop(1, 'rgba(220,230,255,0)');
      ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    ctx.restore();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(245,245,255,0.88)';
  ctx.save(); ctx.translate(half * 1.5, H * 0.3);                      // hours plate
  ctx.font = `30px ${ARCADE_FONT}`; ctx.fillText('OPEN', 0, 0);
  ctx.font = `13px ${ARCADE_FONT}`; ctx.fillText('11AM - 2AM', 0, 38); ctx.fillText('EVERY DAY', 0, 62);
  ctx.restore();
  ctx.save(); ctx.translate(half * 0.5, H * 0.3);                      // round sticker
  ctx.strokeStyle = 'rgba(245,245,255,0.88)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 42, 0, Math.PI * 2); ctx.stroke();
  ctx.font = `14px ${ARCADE_FONT}`; ctx.fillText('ALL', 0, -10); ctx.fillText('AGES', 0, 12);
  ctx.restore();
  ctx.font = `10px ${ARCADE_FONT}`; ctx.fillStyle = 'rgba(245,245,255,0.7)';
  ctx.save(); ctx.translate(half * 1.5, H * 0.53); ctx.fillText('PUSH', 0, 0); ctx.restore();
  ctx.save(); ctx.translate(half * 0.5, H * 0.53); ctx.fillText('PUSH', 0, 0); ctx.restore();
}

function roomGlassTexture() {
  const W = 640, H = 512, { canvas, ctx } = makeCanvas(W, H);
  const tex = canvasTexture(canvas, { anisotropy: 4 });
  roomDrawGlass(ctx, W, H);
  fontsReady.then(() => { roomDrawGlass(ctx, W, H); tex.needsUpdate = true; });
  return tex;
}

// ══════════════════════════ materials ══════════════════════════

    wall: std({ map: wall.map, bumpMap: wall.bump, bumpScale: 1.6, roughnessMap: wall.bump, roughness: 1, metalness: 0 }),
