<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: a plain stylesheet link would keep the whole page blank (and delay every script) while Google Fonts is slow or unreachable. -->
<link id="fontsheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.dataset.state='ok';this.media='all'" onerror="this.dataset.state='err'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05040a; font-family: system-ui, sans-serif; }
  canvas { display: block; }

  /* "Click to enter" overlay: shown whenever the mouse is not captured. */
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.5rem;
    background: rgba(5, 4, 10, 0.78); color: #dcd6f0;
    cursor: pointer; user-select: none; text-align: center; padding: 0 16px;
  }
  #prompt { font-size: 2.2rem; letter-spacing: 0.08em; color: #ff4fd8; text-shadow: 0 0 12px #ff4fd8, 0 0 32px #9b5cff; }
  #controls { border-spacing: 0.6rem 0.4rem; text-align: left; }
  #controls td:first-child { text-align: right; }
  kbd { padding: 0.15em 0.5em; border: 1px solid #00e5ff; border-radius: 4px; color: #00e5ff; font: inherit; font-size: 0.9rem; }
  body.locked #overlay { display: none; }

  /* Small dot crosshair, only shown while the mouse is captured. */
  #crosshair {
    display: none; position: fixed; left: 50%; top: 50%; width: 4px; height: 4px;
    margin: -2px 0 0 -2px; border-radius: 50%; background: #fff; opacity: 0.85;
    box-shadow: 0 0 2px #000; pointer-events: none;
  }
  body.locked #crosshair { display: block; }

  /* Brief message at the bottom of the screen (e.g. "Sound off"). */
  #toast {
    position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%);
    padding: 0.5em 1em; border-radius: 6px; background: rgba(5, 4, 10, 0.7); color: #dcd6f0;
    font-size: 0.9rem; pointer-events: none; opacity: 0; transition: opacity 0.25s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="overlay">
  <div id="prompt">Loading…</div>
  <table id="controls">
    <tr><td><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> / arrows</td><td>Walk</td></tr>
    <tr><td><kbd>Mouse</kbd></td><td>Look around</td></tr>
    <tr><td><kbd>Shift</kbd></td><td>Move faster</td></tr>
    <tr><td><kbd>M</kbd></td><td>Sound on / off</td></tr>
    <tr><td><kbd>Esc</kbd></td><td>Release the mouse</td></tr>
  </table>
</div>
<div id="crosshair"></div>
<div id="toast"></div>

<script>
  // Three.js comes from a CDN. Say so if the app never reaches "Click to enter": slow (8 s) or failed (error / 30 s).
  (() => {
    const p = document.getElementById('prompt');
    let failed = false;
    const say = (msg, hard) => {          // the app sets data-ready once it is running; a hard failure message is never replaced
      if (p.dataset.ready || failed) return;
      failed = !!hard; p.textContent = msg; p.style.fontSize = '1.2rem';
    };
    const fail = () => say('Could not start. Check your internet connection (Three.js loads from a CDN) and that WebGL is enabled.', true);
    setTimeout(() => say('Still loading… (Three.js comes from a CDN, so this needs an internet connection.)'), 8000);
    setTimeout(fail, 30000);
    addEventListener('error', (e) => { if (!(e.target && e.target.tagName === 'LINK')) fail(); }, true);   // uncaught exception or failed module load
  })();
</script>
